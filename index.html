<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅遊記帳</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅遊記帳">

  <!-- 樣式與依賴套件 (最相容版本) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-50 via-blue-50/40 to-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 布丁狗專屬圖示 (已修復 JSX 屬性為駝峰式命名，杜絕崩潰)
    const PompompurinIcon = ({ className = "w-11 h-11" }) => (
      <svg className={className} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="200" height="200" rx="46" fill="#FEF9C3" stroke="#FDE047" strokeWidth="6"/>
        <circle cx="45" cy="50" r="24" fill="#86EFAC" stroke="#166534" strokeWidth="4"/>
        <path d="M35 38C45 42 50 35 55 45" stroke="#38BDF8" strokeWidth="6" strokeLinecap="round"/>
        <path d="M145 35L170 30L175 42L150 45Z" fill="#E0F2FE" stroke="#0369A1" strokeWidth="3"/>
        <circle cx="160" cy="38" r="2" fill="#0284C7"/>
        <circle cx="166" cy="37" r="2" fill="#0284C7"/>
        <ellipse cx="65" cy="85" rx="16" ry="26" fill="#FDE047" stroke="#713F12" strokeWidth="6" transform="rotate(-20 65 85)"/>
        <ellipse cx="135" cy="85" rx="16" ry="26" fill="#FDE047" stroke="#713F12" strokeWidth="6" transform="rotate(20 135 85)"/>
        <circle cx="100" cy="105" r="46" fill="#FEF08A" stroke="#713F12" strokeWidth="6"/>
        <ellipse cx="100" cy="62" rx="28" ry="14" fill="#78350F" stroke="#451A03" strokeWidth="4"/>
        <circle cx="100" cy="50" r="4" fill="#78350F"/>
        <ellipse cx="80" cy="100" rx="4" ry="5" fill="#713F12"/>
        <ellipse cx="120" cy="100" rx="4" ry="5" fill="#713F12"/>
        <ellipse cx="100" cy="108" rx="6" ry="4" fill="#713F12"/>
        <path d="M93 114C97 118 100 118 100 114C100 118 103 118 107 114" stroke="#713F12" strokeWidth="4" strokeLinecap="round"/>
        <path d="M72 130L98 120L124 130L98 140Z" fill="#BAE6FD" stroke="#0284C7" strokeWidth="4"/>
        <circle cx="98" cy="130" r="4" fill="#EF4444"/>
        <rect x="135" y="115" width="30" height="42" rx="6" fill="#F472B6" stroke="#9D174D" strokeWidth="4"/>
        <ellipse cx="42" cy="150" rx="14" ry="6" fill="#FACC15" stroke="#854D0E" strokeWidth="3"/>
        <ellipse cx="42" cy="144" rx="14" ry="6" fill="#FACC15" stroke="#854D0E" strokeWidth="3"/>
      </svg>
    );

    const DBS_CARDS = [
      { id: 'dbs-eco', name: '星展 eco 永續卡 (日韓歐美 5%)', rate: 5.0, fee: 1.5 },
      { id: 'dbs-eco-general', name: '星展 eco 永續卡 (一般海外 1.5%)', rate: 1.5, fee: 1.5 },
      { id: 'dbs-flight', name: '星展 飛行世界卡 (哩程累積)', rate: 3.3, fee: 1.5 },
      { id: 'dbs-everyday', name: '星展 everyday 卡', rate: 3.0, fee: 1.5 }
    ];

    const DEFAULT_TRIP = [
      {
        id: 'trip-1',
        name: '2026/11 日本東京',
        currency: 'JPY',
        companions: ['我', '旅伴A'],
        expenses: []
      }
    ];

    function App() {
      const [trips, setTrips] = useState(() => {
        try {
          const saved = localStorage.getItem('TRAVEL_APP_DATA_V2');
          return saved ? JSON.parse(saved) : DEFAULT_TRIP;
        } catch (e) {
          return DEFAULT_TRIP;
        }
      });
      const [activeTripId, setActiveTripId] = useState(trips[0]?.id || '');
      const [isModalOpen, setIsModalOpen] = useState(false);

      const currentTrip = trips.find(t => t.id === activeTripId) || trips[0];

      useEffect(() => {
        localStorage.setItem('TRAVEL_APP_DATA_V2', JSON.stringify(trips));
      }, [trips]);

      const [formData, setFormData] = useState({
        title: '',
        category: '機票',
        stage: 'pre',
        currency: 'JPY',
        origAmount: '',
        date: new Date().toISOString().split('T')[0],
        cardId: 'dbs-eco',
        payer: '我'
      });

      const avgRate = 0.22; // 預設平均匯率

      const toTWD = (item) => {
        if (item.currency === 'TWD') return Number(item.origAmount || 0);
        return Math.round(Number(item.origAmount || 0) * avgRate);
      };

      const stats = useMemo(() => {
        if (!currentTrip) return { total: 0, pre: 0, cardNet: 0 };
        let total = 0, pre = 0, cardNet = 0;
        (currentTrip.expenses || []).forEach(ex => {
          const val = toTWD(ex);
          total += val;
          if (ex.stage === 'pre') pre += val;
          const card = DBS_CARDS.find(c => c.id === ex.cardId) || DBS_CARDS[0];
          cardNet += Math.round(val * ((card.rate - card.fee) / 100));
        });
        return { total, pre, cardNet };
      }, [currentTrip]);

      const handleSave = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.origAmount) return;

        const newEntry = {
          id: 'exp-' + Date.now(),
          ...formData,
          origAmount: parseFloat(formData.origAmount)
        };

        const updated = trips.map(t => {
          if (t.id === currentTrip.id) {
            return { ...t, expenses: [newEntry, ...(t.expenses || [])] };
          }
          return t;
        });

        setTrips(updated);
        setIsModalOpen(false);
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-6">
          {/* 頂部導航列 */}
          <div className="bg-white/95 p-4 rounded-3xl border border-sky-100 shadow-sm flex items-center justify-between mb-6">
            <div className="flex items-center space-x-3">
              <PompompurinIcon className="w-12 h-12 rounded-2xl shadow-xs" />
              <div>
                <h1 className="text-xl font-bold text-slate-900 tracking-tight">旅遊記帳</h1>
                <p className="text-xs text-sky-600 font-medium">星展信用卡回饋 • 預付機酒歸戶</p>
              </div>
            </div>

            <button
              onClick={() => {
                setFormData({
                  title: '',
                  category: '機票',
                  stage: 'pre',
                  currency: currentTrip.currency,
                  origAmount: '',
                  date: new Date().toISOString().split('T')[0],
                  cardId: 'dbs-eco',
                  payer: '我'
                });
                setIsModalOpen(true);
              }}
              className="px-4 py-2 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white rounded-2xl text-xs font-semibold shadow-sm transition"
            >
              ＋ 記一筆
            </button>
          </div>

          {/* 總結指標卡 */}
          <div className="grid grid-cols-3 gap-3 mb-6">
            <div className="bg-white p-4 rounded-2xl border border-sky-100 shadow-xs">
              <div className="text-xs text-slate-400 font-medium">旅程總支出</div>
              <div className="text-xl font-bold text-slate-800 mt-1">${stats.total.toLocaleString()} <span className="text-xs font-normal text-slate-400">TWD</span></div>
            </div>
            <div className="bg-white p-4 rounded-2xl border border-sky-100 shadow-xs">
              <div className="text-xs text-blue-600 font-medium">提前預購 (機酒)</div>
              <div className="text-xl font-bold text-blue-900 mt-1">${stats.pre.toLocaleString()} <span className="text-xs font-normal text-slate-400">TWD</span></div>
            </div>
            <div className="bg-white p-4 rounded-2xl border border-emerald-100 shadow-xs">
              <div className="text-xs text-emerald-600 font-medium">星展回饋淨賺</div>
              <div className="text-xl font-bold text-emerald-700 mt-1">+${stats.cardNet.toLocaleString()} <span className="text-xs font-normal text-slate-400">TWD</span></div>
            </div>
          </div>

          {/* 消費明細 */}
          <div className="bg-white rounded-3xl border border-sky-100 p-5 shadow-xs">
            <h2 className="text-sm font-bold text-slate-800 mb-3">明細清單</h2>
            {(!currentTrip.expenses || currentTrip.expenses.length === 0) ? (
              <div className="text-center py-12 text-xs text-slate-400">
                目前尚無紀錄，點擊右上角「＋ 記一筆」新增機票或住宿！
              </div>
            ) : (
              <div className="divide-y divide-sky-50">
                {currentTrip.expenses.map(ex => (
                  <div key={ex.id} className="py-3 flex items-center justify-between">
                    <div>
                      <div className="font-semibold text-slate-800 text-sm">{ex.title}</div>
                      <div className="text-xs text-slate-400 mt-0.5">
                        {ex.date} • {ex.category} • {ex.stage === 'pre' ? '行前預購' : '當地支出'}
                      </div>
                    </div>
                    <div className="text-right">
                      <div className="font-bold text-slate-900 text-sm">${toTWD(ex).toLocaleString()} TWD</div>
                      {ex.currency !== 'TWD' && (
                        <div className="text-xs text-slate-400">{ex.currency} {ex.origAmount}</div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* 記帳彈窗 */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-sky-100 text-xs">
                <div className="flex justify-between items-center pb-3 border-b border-sky-100">
                  <h3 className="font-bold text-base text-slate-900">記一筆消費</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 text-sm">✕</button>
                </div>

                <form onSubmit={handleSave} className="mt-4 space-y-3">
                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">品項名稱</label>
                    <input
                      type="text"
                      required
                      placeholder="例：成田機票、新宿飯店"
                      value={formData.title}
                      onChange={e => setFormData({ ...formData, title: e.target.value })}
                      className="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">階段</label>
                      <select
                        value={formData.stage}
                        onChange={e => setFormData({ ...formData, stage: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      >
                        <option value="pre">行前預付</option>
                        <option value="local">當地開銷</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">類別</label>
                      <select
                        value={formData.category}
                        onChange={e => setFormData({ ...formData, category: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      >
                        <option value="機票">機票</option>
                        <option value="住宿">住宿</option>
                        <option value="食">食</option>
                        <option value="交通">交通</option>
                        <option value="其他">其他</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">幣別</label>
                      <select
                        value={formData.currency}
                        onChange={e => setFormData({ ...formData, currency: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      >
                        <option value="JPY">JPY 日幣</option>
                        <option value="TWD">TWD 台幣</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">金額</label>
                      <input
                        type="number"
                        required
                        placeholder="0"
                        value={formData.origAmount}
                        onChange={e => setFormData({ ...formData, origAmount: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">星展信用卡</label>
                    <select
                      value={formData.cardId}
                      onChange={e => setFormData({ ...formData, cardId: e.target.value })}
                      className="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                    >
                      {DBS_CARDS.map(c => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="pt-3 flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 text-slate-400"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-xl font-semibold"
                    >
                      儲存
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
