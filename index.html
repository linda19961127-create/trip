<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅遊記帳</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅遊記帳">
  <link rel="apple-touch-icon" href="https://i.ibb.co/ymkR6Tpk/Gemini-Generated-Image-tj8q2itj8q2itj8q.jpg">
  <link rel="icon" type="image/jpeg" href="https://i.ibb.co/ymkR6Tpk/Gemini-Generated-Image-tj8q2itj8q2itj8q.jpg">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 修正 iOS 日期輸入框跑版或跑出框框的問題 */
    input[type="date"] {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background-color: #f8fafc;
      min-height: 40px;
      line-height: 1.2;
    }
    input[type="date"]::-webkit-date-and-time-value {
      text-align: left;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-50 via-blue-50/40 to-slate-50 text-slate-800 min-h-screen">

  <div class="max-w-3xl mx-auto px-4 py-6">
    <!-- 頂部導航列 -->
    <div class="bg-white/95 p-4 rounded-3xl border border-sky-100 shadow-sm flex items-center justify-between mb-4">
      <div class="flex items-center space-x-3">
        <img 
          src="https://i.ibb.co/ymkR6Tpk/Gemini-Generated-Image-tj8q2itj8q2itj8q.jpg" 
          alt="布丁狗 Logo" 
          class="w-12 h-12 rounded-2xl object-cover shadow-sm border border-amber-200"
        />
        <div>
          <h1 class="text-xl font-bold text-slate-900 tracking-tight">旅遊記帳</h1>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button id="btnOpenCatalog" class="px-3 py-2 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-2xl text-xs font-semibold transition">
          ☰ 目錄
        </button>
        <button id="btnOpenNewTrip" class="px-3.5 py-2 bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 rounded-2xl text-xs font-semibold transition">
          ＋ 新旅程
        </button>
      </div>
    </div>

    <!-- 橫向切換旅程列 -->
    <div class="flex items-center space-x-2 overflow-x-auto scrollbar-none pb-2 mb-3">
      <span class="text-xs text-slate-400 font-medium whitespace-nowrap pl-1">切換旅程：</span>
      <div id="tripTabsContainer" class="flex items-center space-x-2"></div>
    </div>

    <!-- 切換旅程下一行：【＋ 記一筆】大按鈕 -->
    <div class="mb-6">
      <button id="btnOpenAddExpense" class="w-full py-3.5 bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 hover:from-sky-600 text-white rounded-2xl text-sm font-bold shadow-md shadow-sky-200/60 transition flex items-center justify-center space-x-2 active:scale-[0.99]">
        <span class="text-lg leading-none">＋</span>
        <span>記一筆</span>
      </button>
    </div>

    <!-- 總結指標卡 -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-white p-4 rounded-2xl border border-sky-100 shadow-xs">
        <div class="text-xs text-slate-400 font-medium">旅程總支出</div>
        <div class="text-xl font-bold text-slate-800 mt-1"><span id="statTotal">0</span> <span class="text-xs font-normal text-slate-400">TWD</span></div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-sky-100 shadow-xs">
        <div class="text-xs text-blue-600 font-medium">提前預購 (機酒)</div>
        <div class="text-xl font-bold text-blue-900 mt-1"><span id="statPre">0</span> <span class="text-xs font-normal text-slate-400">TWD</span></div>
      </div>
      <div class="bg-white p-4 rounded-2xl border border-emerald-100 shadow-xs">
        <div class="text-xs text-emerald-600 font-medium">星展回饋淨賺</div>
        <div class="text-xl font-bold text-emerald-700 mt-1"><span id="statRewards">+0</span> <span class="text-xs font-normal text-slate-400">TWD</span></div>
      </div>
    </div>

    <!-- 消費明細列表 -->
    <div class="bg-white rounded-3xl border border-sky-100 p-5 shadow-xs">
      <div class="flex justify-between items-center mb-3">
        <div>
          <h2 id="currentTripHeading" class="text-sm font-bold text-slate-800">消費明細</h2>
          <span class="text-[11px] text-slate-400">（左滑項目可刪除）</span>
        </div>
        <span id="currentRateLabel" class="text-xs text-slate-400"></span>
      </div>

      <div id="expenseList" class="rounded-2xl overflow-hidden border border-sky-100 divide-y divide-sky-50"></div>
    </div>
  </div>

  <!-- 彈窗 1：記一筆 / 編輯消費 -->
  <div id="modalExpense" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-sky-100 text-xs">
      <div class="flex justify-between items-center pb-3 border-b border-sky-100">
        <h3 id="modalExpenseTitle" class="font-bold text-base text-slate-900">記一筆消費</h3>
        <button onclick="closeModal('modalExpense')" class="text-slate-400 text-sm">✕</button>
      </div>

      <form id="formExpense" class="mt-4 space-y-3">
        <input type="hidden" id="expEditingId" value="">
        <div>
          <label class="block text-slate-600 mb-1 font-semibold">品項名稱</label>
          <input type="text" id="expTitle" required placeholder="例：酷航機票、新宿飯店" class="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-600 mb-1 font-semibold">階段</label>
            <select id="expStage" class="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2">
              <option value="pre">行前預付</option>
              <option value="local">當地開銷</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-semibold">類別</label>
            <select id="expCategory" class="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2">
              <option value="機票">機票</option>
              <option value="住宿">住宿</option>
              <option value="食">食</option>
              <option value="交通">交通</option>
              <option value="娛樂">娛樂</option>
              <option value="衣服">衣服</option>
              <option value="其他">其他</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-600 mb-1 font-semibold">幣別</label>
            <select id="expCurrency" class="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"></select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-semibold">金額</label>
            <input type="number" step="any" id="expAmount" required placeholder="0" class="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500">
          </div>
        </div>

        <div>
          <label class="block text-slate-600 mb-1 font-semibold">日期</label>
          <input type="date" id="expDate" required class="w-full border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500">
        </div>

        <div>
          <label class="block text-slate-600 mb-1 font-semibold">支付方式</label>
          <select id="expPayMethod" class="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2 text-slate-800 font-medium"></select>
        </div>

        <div class="pt-3 flex justify-end space-x-2">
          <button type="button" onclick="closeModal('modalExpense')" class="px-4 py-2 text-slate-400 font-medium">取消</button>
          <button type="submit" class="px-5 py-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-xl font-semibold shadow-sm">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 彈窗 2：規劃新旅程 (改為選地點、時間、幣別) -->
  <div id="modalNewTrip" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-sky-100 text-xs">
      <div class="flex justify-between items-center pb-3 border-b border-sky-100">
        <h3 class="font-bold text-base text-slate-900">規劃新旅程</h3>
        <button onclick="closeModal('modalNewTrip')" class="text-slate-400 text-sm">✕</button>
      </div>

      <form id="formNewTrip" class="mt-4 space-y-3">
        <!-- 選擇目的地地點 -->
        <div>
          <label class="block text-slate-600 mb-1 font-semibold">目的地地點</label>
          <select id="newTripLocationSelect" class="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800">
            <option value="日本東京" data-cur="JPY" data-rate="0.22">🇯🇵 日本 (東京/大阪/京都 - JPY)</option>
            <option value="泰國曼谷" data-cur="THB" data-rate="0.95">🇹🇭 泰國 (曼谷/清邁 - THB)</option>
            <option value="韓國首爾" data-cur="KRW" data-rate="0.024">🇰🇷 韓國 (首爾/釜山 - KRW)</option>
            <option value="歐洲旅遊" data-cur="EUR" data-rate="35.0">🇪🇺 歐洲 (法國/義大利/德國 - EUR)</option>
            <option value="美國旅遊" data-cur="USD" data-rate="32.5">🇺🇸 美國 (USD)</option>
            <option value="新加坡" data-cur="SGD" data-rate="24.5">🇸🇬 新加坡 (SGD)</option>
            <option value="越南" data-cur="VND" data-rate="0.0013">🇻🇳 越南 (VND)</option>
            <option value="自訂其他" data-cur="OTHER" data-rate="1.0">✏️ 自訂其他目的地...</option>
          </select>
        </div>

        <!-- 自訂名稱 (若選自訂時可輸入) -->
        <div id="customLocWrapper" class="hidden">
          <label class="block text-slate-600 mb-1 font-semibold">自訂旅程名稱</label>
          <input type="text" id="newTripCustomName" placeholder="例如：2026/11 沖繩海島行" class="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800">
        </div>

        <!-- 出國時間區間 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-600 mb-1 font-semibold">出發日期</label>
            <input type="date" id="newTripStartDate" required class="w-full border border-sky-100 rounded-xl px-2 py-2 text-slate-800">
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-semibold">回程日期</label>
            <input type="date" id="newTripEndDate" required class="w-full border border-sky-100 rounded-xl px-2 py-2 text-slate-800">
          </div>
        </div>

        <!-- 外幣代碼 (自動帶入，亦可自由修改) -->
        <div>
          <label class="block text-slate-600 mb-1 font-semibold">當地外幣幣別</label>
          <input type="text" id="newTripCurrency" required value="JPY" class="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 uppercase">
          <input type="hidden" id="newTripRate" value="0.22">
          <p class="text-[10px] text-slate-400 mt-1">💡 系統會依您選擇的地點自動匹配，匯率將依實際花費或即時基準動態折算，免手動算數學。</p>
        </div>

        <div class="pt-3 flex justify-end space-x-2">
          <button type="button" onclick="closeModal('modalNewTrip')" class="px-4 py-2 text-slate-400">取消</button>
          <button type="submit" class="px-5 py-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-xl font-semibold">建立旅程</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 彈窗 3：新增支付方式 -->
  <div id="modalNewPay" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-sky-100 text-xs">
      <div class="flex justify-between items-center pb-3 border-b border-sky-100">
        <h3 class="font-bold text-base text-slate-900">新增支付方式</h3>
        <button onclick="closeModal('modalNewPay')" class="text-slate-400 text-sm">✕</button>
      </div>

      <form id="formNewPay" class="mt-4 space-y-3">
        <div>
          <label class="block text-slate-600 mb-1 font-semibold">支付方式名稱</label>
          <input type="text" id="newPayName" required placeholder="例：LINE Pay、街口、玉山卡" class="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500">
        </div>

        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="newPayIsCard" class="rounded border-sky-200 text-sky-600">
          <label for="newPayIsCard" class="text-slate-700 font-medium cursor-pointer">此為信用卡（需計算手續費與回饋）</label>
        </div>

        <div id="cardFields" class="grid grid-cols-2 gap-2 pt-1 hidden">
          <div>
            <label class="block text-slate-600 mb-1 font-semibold">海外回饋率 (%)</label>
            <input type="number" step="0.1" id="newPayRate" placeholder="3.0" value="0" class="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2">
          </div>
          <div>
            <label class="block text-slate-600 mb-1 font-semibold">海外手續費 (%)</label>
            <input type="number" step="0.1" id="newPayFee" placeholder="1.5" value="0" class="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2">
          </div>
        </div>

        <div class="pt-3 flex justify-end space-x-2">
          <button type="button" onclick="closeModal('modalNewPay')" class="px-4 py-2 text-slate-400">取消</button>
          <button type="submit" class="px-5 py-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-xl font-semibold">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 彈窗 4：旅程目錄 -->
  <div id="modalCatalog" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-sky-100 text-xs max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center pb-3 border-b border-sky-100">
        <div>
          <h3 class="font-bold text-base text-slate-900">旅程總目錄</h3>
          <p class="text-[11px] text-slate-400">點擊任一旅程卡片即可切換並查看紀錄</p>
        </div>
        <button onclick="closeModal('modalCatalog')" class="text-slate-400 text-sm">✕</button>
      </div>

      <div id="catalogList" class="mt-4 space-y-3 overflow-y-auto flex-1 pr-1"></div>

      <div class="pt-4 border-t border-sky-100 flex justify-between items-center">
        <button id="btnCatalogCreate" class="text-sky-600 hover:text-sky-700 font-semibold text-xs">
          ＋ 規劃全新旅程
        </button>
        <button onclick="closeModal('modalCatalog')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-medium">
          關閉
        </button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_PAY = [
      { id: 'dbs-eco', name: '星展 eco 永續卡', rate: 5.0, fee: 1.5, isCard: true },
      { id: 'cash', name: '現金', rate: 0, fee: 0, isCard: false }
    ];

    const DEFAULT_DATA = [
      { id: 'trip-1', name: '2026/11 日本東京', currency: 'JPY', rate: 0.22, startDate: '2026-11-11', endDate: '2026-11-16', expenses: [] },
      { id: 'trip-2', name: '2026/12 泰國曼谷', currency: 'THB', rate: 0.95, startDate: '2026-12-16', endDate: '2026-12-20', expenses: [] }
    ];

    let trips = JSON.parse(localStorage.getItem('TB_TRIPS_V10') || 'null') || DEFAULT_DATA;
    let payMethods = JSON.parse(localStorage.getItem('TB_PAY_V10') || 'null') || DEFAULT_PAY;
    let activeTripId = trips[0] ? trips[0].id : '';

    function saveState() {
      localStorage.setItem('TB_TRIPS_V10', JSON.stringify(trips));
      localStorage.setItem('TB_PAY_V10', JSON.stringify(payMethods));
      render();
    }

    function getCurrentTrip() {
      return trips.find(t => t.id === activeTripId) || trips[0];
    }

    function toTWD(exp, trip) {
      if (!exp) return 0;
      if (exp.currency === 'TWD') return Number(exp.amount || 0);
      const rate = trip.rate || (trip.currency === 'JPY' ? 0.22 : (trip.currency === 'THB' ? 0.95 : 1.0));
      return Math.round(Number(exp.amount || 0) * rate);
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // --- 畫面渲染 ---
    function render() {
      const trip = getCurrentTrip();
      if (!trip) return;

      document.getElementById('currentTripHeading').innerText = `【${trip.name}】消費明細`;
      document.getElementById('currentRateLabel').innerText = `幣別：${trip.currency}`;

      // 切換旅程按鈕
      const tabs = document.getElementById('tripTabsContainer');
      tabs.innerHTML = '';
      trips.forEach(t => {
        const btn = document.createElement('button');
        const active = t.id === trip.id;
        btn.className = `px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition border ${
          active ? 'bg-sky-500 text-white border-transparent shadow-xs' : 'bg-white text-slate-600 border-sky-100 hover:bg-sky-50'
        }`;
        btn.innerText = `${t.name} (${t.currency})`;
        btn.onclick = () => { 
          activeTripId = t.id; 
          render(); 
        };
        tabs.appendChild(btn);
      });

      // 統計指標
      let total = 0, pre = 0, rewards = 0;
      (trip.expenses || []).forEach(ex => {
        const twd = toTWD(ex, trip);
        total += twd;
        if (ex.stage === 'pre') pre += twd;
        const method = payMethods.find(m => m.id === ex.payMethodId);
        if (method && method.isCard) {
          rewards += Math.round(twd * ((method.rate - method.fee) / 100));
        }
      });

      document.getElementById('statTotal').innerText = '$' + total.toLocaleString();
      document.getElementById('statPre').innerText = '$' + pre.toLocaleString();
      document.getElementById('statRewards').innerText = (rewards >= 0 ? '+$' : '-$') + Math.abs(rewards).toLocaleString();

      // 明細清單 (修正左滑才露出刪除)
      const list = document.getElementById('expenseList');
      list.innerHTML = '';

      if (!trip.expenses || trip.expenses.length === 0) {
        list.innerHTML = '<div class="text-center py-12 text-xs text-slate-400">目前尚無紀錄，點擊上方「＋ 記一筆」新增！</div>';
      } else {
        trip.expenses.forEach(ex => {
          const itemTwd = toTWD(ex, trip);
          const rowWrapper = document.createElement('div');
          // 設定 position relative 與 overflow hidden，底層的刪除按鈕平時完全隱藏
          rowWrapper.className = 'relative overflow-hidden bg-rose-600 border-b border-sky-50 last:border-b-0';

          rowWrapper.innerHTML = `
            <div class="absolute inset-y-0 right-0 w-20 flex items-center justify-center">
              <button class="btnDeleteRow w-full h-full bg-rose-600 active:bg-rose-700 text-white font-semibold text-xs flex items-center justify-center">刪除</button>
            </div>
            <div class="swipe-item relative p-4 bg-white flex items-center justify-between select-none transition-transform duration-150 ease-out" style="transform: translateX(0px);">
              <div class="pr-2">
                <div class="font-semibold text-slate-800 text-sm">${ex.title}</div>
                <div class="text-xs text-slate-400 mt-0.5">${ex.date} • ${ex.category} • ${ex.stage === 'pre' ? '行前預購' : '當地支出'} • ${ex.payMethodName}</div>
              </div>
              <div class="flex items-center space-x-3 shrink-0">
                <div class="text-right">
                  <div class="font-bold text-slate-900 text-sm">$${itemTwd.toLocaleString()} TWD</div>
                  ${ex.currency !== 'TWD' ? `<div class="text-xs text-slate-400">${ex.currency} ${ex.amount}</div>` : ''}
                </div>
                <button class="btnEditRow text-xs text-slate-400 hover:text-slate-600 px-2 py-1 rounded-lg hover:bg-slate-50 transition">編輯</button>
              </div>
            </div>
          `;

          const swipeItem = rowWrapper.querySelector('.swipe-item');
          let startX = 0, isOpen = false;

          swipeItem.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
          }, { passive: true });

          swipeItem.addEventListener('touchmove', (e) => {
            const diff = e.touches[0].clientX - startX;
            if (isOpen) {
              if (diff > 0 && diff <= 80) swipeItem.style.transform = `translateX(${-80 + diff}px)`;
            } else {
              if (diff < 0 && diff >= -90) swipeItem.style.transform = `translateX(${diff}px)`;
            }
          }, { passive: true });

          swipeItem.addEventListener('touchend', (e) => {
            const matrix = new WebKitCSSMatrix(window.getComputedStyle(swipeItem).transform);
            const x = matrix.m41;
            if (x < -40) {
              swipeItem.style.transform = 'translateX(-76px)';
              isOpen = true;
            } else {
              swipeItem.style.transform = 'translateX(0px)';
              isOpen = false;
            }
          });

          // 刪除按鈕
          rowWrapper.querySelector('.btnDeleteRow').onclick = () => {
            if (confirm(`確定要刪除「${ex.title}」這筆紀錄嗎？`)) {
              trip.expenses = trip.expenses.filter(i => i.id !== ex.id);
              saveState();
            }
          };

          // 編輯按鈕
          rowWrapper.querySelector('.btnEditRow').onclick = (e) => {
            e.stopPropagation();
            openEditExpense(ex);
          };

          list.appendChild(rowWrapper);
        });
      }

      // 目錄列表
      const catalog = document.getElementById('catalogList');
      catalog.innerHTML = '';
      trips.forEach(t => {
        const isCurrent = t.id === trip.id;
        const sumTWD = (t.expenses || []).reduce((s, item) => s + toTWD(item, t), 0);
        const card = document.createElement('div');
        card.className = `p-4 rounded-2xl border cursor-pointer transition flex items-center justify-between ${
          isCurrent ? 'bg-sky-50/70 border-sky-400 ring-1 ring-sky-300' : 'bg-white border-sky-100 hover:bg-sky-50/40'
        }`;
        card.innerHTML = `
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-bold text-slate-800 text-sm">${t.name}</span>
              ${isCurrent ? '<span class="px-2 py-0.5 rounded-full text-[10px] bg-sky-500 text-white font-medium">目前選取</span>' : ''}
            </div>
            <div class="text-slate-400 text-[11px] mt-1">幣別：${t.currency} • 共 ${(t.expenses || []).length} 筆消費</div>
          </div>
          <div class="text-right">
            <div class="font-bold text-slate-900 text-sm">$${sumTWD.toLocaleString()} <span class="text-[10px] text-slate-400 font-normal">TWD</span></div>
            <span class="text-[11px] text-sky-600 font-medium">點擊查看 ➜</span>
          </div>
        `;
        card.onclick = () => {
          activeTripId = t.id;
          closeModal('modalCatalog');
          render();
        };
        catalog.appendChild(card);
      });
    }

    // 動態帶入當前旅程所屬的外幣
    function populateCurrencySelect(selectedCur) {
      const trip = getCurrentTrip();
      const select = document.getElementById('expCurrency');
      select.innerHTML = '';

      // 選項 1: 該國外幣 (如 JPY、THB、EUR 等)
      const foreignOpt = document.createElement('option');
      foreignOpt.value = trip.currency;
      foreignOpt.innerText = `${trip.currency} 當地外幣`;
      select.appendChild(foreignOpt);

      // 選項 2: 新台幣
      const twdOpt = document.createElement('option');
      twdOpt.value = 'TWD';
      twdOpt.innerText = 'TWD 台幣';
      select.appendChild(twdOpt);

      select.value = selectedCur || trip.currency;
    }

    function populatePaySelect(selectedId) {
      const select = document.getElementById('expPayMethod');
      select.innerHTML = '';
      payMethods.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.innerText = m.name;
        if (m.id === selectedId) opt.selected = true;
        select.appendChild(opt);
      });
      const addOpt = document.createElement('option');
      addOpt.value = '__add_new__';
      addOpt.innerText = '＋ 新增支付方式...';
      select.appendChild(addOpt);
    }

    function openAddExpense() {
      const trip = getCurrentTrip();
      document.getElementById('modalExpenseTitle').innerText = '記一筆消費';
      document.getElementById('expEditingId').value = '';
      document.getElementById('expTitle').value = '';
      document.getElementById('expStage').value = 'pre';
      document.getElementById('expCategory').value = '機票';
      document.getElementById('expAmount').value = '';
      document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
      populateCurrencySelect(trip.currency);
      populatePaySelect(payMethods[0]?.id || 'dbs-eco');
      openModal('modalExpense');
    }

    function openEditExpense(ex) {
      document.getElementById('modalExpenseTitle').innerText = '修改消費紀錄';
      document.getElementById('expEditingId').value = ex.id;
      document.getElementById('expTitle').value = ex.title;
      document.getElementById('expStage').value = ex.stage;
      document.getElementById('expCategory').value = ex.category;
      document.getElementById('expAmount').value = ex.amount;
      document.getElementById('expDate').value = ex.date;
      populateCurrencySelect(ex.currency);
      populatePaySelect(ex.payMethodId);
      openModal('modalExpense');
    }

    // 事件監聽
    document.getElementById('btnOpenAddExpense').onclick = openAddExpense;
    document.getElementById('btnOpenNewTrip').onclick = () => {
      document.getElementById('newTripStartDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('newTripEndDate').value = new Date(Date.now() + 5*86400000).toISOString().split('T')[0];
      openModal('modalNewTrip');
    };
    document.getElementById('btnOpenCatalog').onclick = () => openModal('modalCatalog');
    document.getElementById('btnCatalogCreate').onclick = () => {
      closeModal('modalCatalog');
      openModal('modalNewTrip');
    };

    // 新增旅程選單切換地點連動幣別
    document.getElementById('newTripLocationSelect').onchange = (e) => {
      const selected = e.target.selectedOptions[0];
      const cur = selected.getAttribute('data-cur');
      const rate = selected.getAttribute('data-rate');
      const isCustom = cur === 'OTHER';

      document.getElementById('customLocWrapper').classList.toggle('hidden', !isCustom);
      if (!isCustom) {
        document.getElementById('newTripCurrency').value = cur;
        document.getElementById('newTripRate').value = rate;
      } else {
        document.getElementById('newTripCurrency').value = '';
        document.getElementById('newTripRate').value = '1.0';
      }
    };

    document.getElementById('expPayMethod').onchange = (e) => {
      if (e.target.value === '__add_new__') {
        openModal('modalNewPay');
      }
    };

    document.getElementById('newPayIsCard').onchange = (e) => {
      document.getElementById('cardFields').classList.toggle('hidden', !e.target.checked);
    };

    // 儲存消費
    document.getElementById('formExpense').onsubmit = (e) => {
      e.preventDefault();
      const trip = getCurrentTrip();
      const editingId = document.getElementById('expEditingId').value;
      const payId = document.getElementById('expPayMethod').value;
      const payObj = payMethods.find(m => m.id === payId);

      const entry = {
        id: editingId || ('exp-' + Date.now()),
        title: document.getElementById('expTitle').value,
        stage: document.getElementById('expStage').value,
        category: document.getElementById('expCategory').value,
        currency: document.getElementById('expCurrency').value,
        amount: parseFloat(document.getElementById('expAmount').value) || 0,
        date: document.getElementById('expDate').value,
        payMethodId: payId,
        payMethodName: payObj ? payObj.name : '星展 eco 永續卡'
      };

      if (editingId) {
        trip.expenses = trip.expenses.map(i => i.id === editingId ? entry : i);
      } else {
        trip.expenses = [entry, ...(trip.expenses || [])];
      }

      closeModal('modalExpense');
      saveState();
    };

    // 建立新旅程 (依地點與時間建立)
    document.getElementById('formNewTrip').onsubmit = (e) => {
      e.preventDefault();
      const select = document.getElementById('newTripLocationSelect');
      const isCustom = select.value === '自訂其他';
      const locName = isCustom ? document.getElementById('newTripCustomName').value : select.value;
      const start = document.getElementById('newTripStartDate').value;
      const end = document.getElementById('newTripEndDate').value;
      const startYearMonth = start ? start.substring(0, 7).replace('-', '/') : '';
      
      const tripTitle = `${startYearMonth} ${locName}`;
      const cur = document.getElementById('newTripCurrency').value.toUpperCase() || 'JPY';
      const rate = parseFloat(document.getElementById('newTripRate').value) || 1.0;

      const newTrip = {
        id: 'trip-' + Date.now(),
        name: tripTitle,
        currency: cur,
        rate: rate,
        startDate: start,
        endDate: end,
        expenses: []
      };

      trips.push(newTrip);
      activeTripId = newTrip.id;
      document.getElementById('formNewTrip').reset();
      closeModal('modalNewTrip');
      saveState();
    };

    // 新增支付方式
    document.getElementById('formNewPay').onsubmit = (e) => {
      e.preventDefault();
      const isCard = document.getElementById('newPayIsCard').checked;
      const newMethod = {
        id: 'pay-' + Date.now(),
        name: document.getElementById('newPayName').value,
        isCard: isCard,
        rate: isCard ? (parseFloat(document.getElementById('newPayRate').value) || 0) : 0,
        fee: isCard ? (parseFloat(document.getElementById('newPayFee').value) || 0) : 0
      };
      payMethods.push(newMethod);
      document.getElementById('formNewPay').reset();
      document.getElementById('cardFields').classList.add('hidden');
      closeModal('modalNewPay');
      populatePaySelect(newMethod.id);
      saveState();
    };

    // 啟動
    render();
  </script>
</body>
</html>
