<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅遊記帳</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅遊記帳">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <!-- Tailwind CSS 與 React -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="date"] {
      -webkit-appearance: none;
      min-height: 38px;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-50 via-blue-50/40 to-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DESTINATIONS = [
      { name: '日本', currency: 'JPY', defaultRate: 0.22 },
      { name: '泰國', currency: 'THB', defaultRate: 0.95 },
      { name: '韓國', currency: 'KRW', defaultRate: 0.024 },
      { name: '歐美 (美元)', currency: 'USD', defaultRate: 32.5 },
      { name: '歐洲 (歐元)', currency: 'EUR', defaultRate: 35.0 },
      { name: '其他', currency: 'USD', defaultRate: 32.5 }
    ];

    const DBS_CARDS = [
      { id: 'dbs-eco', name: '星展 eco 永續卡 (日韓歐美 5%)', rate: 5.0, fee: 1.5 },
      { id: 'dbs-eco-general', name: '星展 eco 永續卡 (一般海外 1.5%)', rate: 1.5, fee: 1.5 },
      { id: 'dbs-flight', name: '星展 飛行世界卡 (哩程累積)', rate: 3.3, fee: 1.5 },
      { id: 'dbs-everyday', name: '星展 everyday 卡', rate: 3.0, fee: 1.5 }
    ];

    const DEFAULT_TRIPS = [
      {
        id: 'trip-1',
        name: '日本東京',
        destination: '日本',
        currency: 'JPY',
        startDate: '2026-11-16',
        endDate: '2026-11-20',
        expenses: []
      }
    ];

    function App() {
      const [trips, setTrips] = useState(() => {
        try {
          const saved = localStorage.getItem('TRAVEL_APP_TRIPS_V4');
          return saved ? JSON.parse(saved) : DEFAULT_TRIPS;
        } catch (e) {
          return DEFAULT_TRIPS;
        }
      });
      const [activeTripId, setActiveTripId] = useState(trips[0]?.id || '');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);
      
      // 旅程 Modal 狀態
      const [isTripModalOpen, setIsTripModalOpen] = useState(false);
      const [editingTripId, setEditingTripId] = useState(null);

      const currentTrip = trips.find(t => t.id === activeTripId) || trips[0] || DEFAULT_TRIPS[0];

      useEffect(() => {
        localStorage.setItem('TRAVEL_APP_TRIPS_V4', JSON.stringify(trips));
      }, [trips]);

      // 取得特定目的地對應的預設匯率
      const getDefRate = (destName) => {
        return DESTINATIONS.find(d => d.name === destName)?.defaultRate || 1;
      };

      // 記帳表單
      const [formData, setFormData] = useState({
        title: '',
        category: '機票',
        stage: 'pre',
        currency: currentTrip.currency,
        origAmount: '',
        rate: getDefRate(currentTrip.destination),
        date: new Date().toISOString().split('T')[0],
        cardId: 'dbs-eco'
      });

      // 旅程表單（地點、時間）
      const [tripFormData, setTripFormData] = useState({
        destination: '泰國',
        name: '泰國曼谷',
        currency: 'THB',
        startDate: new Date().toISOString().split('T')[0],
        endDate: new Date().toISOString().split('T')[0]
      });

      // 當切換旅程時，更新記帳表單的幣別與參考匯率
      useEffect(() => {
        if (currentTrip) {
          setFormData(prev => ({
            ...prev,
            currency: currentTrip.currency,
            rate: getDefRate(currentTrip.destination)
          }));
        }
      }, [activeTripId]);

      // 單筆金額換算成台幣
      const toTWD = (item) => {
        if (item.currency === 'TWD') return Math.round(Number(item.origAmount || 0));
        const rate = Number(item.rate) || 1;
        return Math.round(Number(item.origAmount || 0) * rate);
      };

      // 統計數據
      const stats = useMemo(() => {
        if (!currentTrip) return { total: 0, pre: 0, cardNet: 0 };
        let total = 0, pre = 0, cardNet = 0;
        (currentTrip.expenses || []).forEach(ex => {
          const val = toTWD(ex);
          total += val;
          if (ex.stage === 'pre') pre += val;
          const card = DBS_CARDS.find(c => c.id === ex.cardId) || DBS_CARDS[0];
          cardNet += Math.round(val * ((card.rate - card.fee) / 100));
        });
        return { total, pre, cardNet };
      }, [currentTrip]);

      // 開啟記一筆
      const handleOpenAdd = () => {
        setEditingId(null);
        setFormData({
          title: '',
          category: '機票',
          stage: 'pre',
          currency: currentTrip.currency,
          origAmount: '',
          rate: getDefRate(currentTrip.destination),
          date: new Date().toISOString().split('T')[0],
          cardId: 'dbs-eco'
        });
        setIsModalOpen(true);
      };

      // 開啟編輯消費
      const handleOpenEdit = (expense) => {
        setEditingId(expense.id);
        setFormData({
          title: expense.title,
          category: expense.category,
          stage: expense.stage,
          currency: expense.currency,
          origAmount: expense.origAmount.toString(),
          rate: expense.rate || getDefRate(currentTrip.destination),
          date: expense.date,
          cardId: expense.cardId || 'dbs-eco'
        });
        setIsModalOpen(true);
      };

      // 刪除消費
      const handleDeleteExpense = (id, title) => {
        if (window.confirm(`確定要刪除「${title}」這筆紀錄嗎？`)) {
          const updated = trips.map(t => {
            if (t.id === currentTrip.id) {
              return { ...t, expenses: t.expenses.filter(e => e.id !== id) };
            }
            return t;
          });
          setTrips(updated);
        }
      };

      // 儲存消費
      const handleSaveExpense = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.origAmount) return;

        const record = {
          ...formData,
          origAmount: parseFloat(formData.origAmount),
          rate: formData.currency === 'TWD' ? 1 : parseFloat(formData.rate) || 1
        };

        if (editingId) {
          const updated = trips.map(t => {
            if (t.id === currentTrip.id) {
              return {
                ...t,
                expenses: t.expenses.map(exp => exp.id === editingId ? { ...exp, ...record } : exp)
              };
            }
            return t;
          });
          setTrips(updated);
        } else {
          const newEntry = {
            id: 'exp-' + Date.now(),
            ...record
          };
          const updated = trips.map(t => {
            if (t.id === currentTrip.id) {
              return { ...t, expenses: [newEntry, ...(t.expenses || [])] };
            }
            return t;
          });
          setTrips(updated);
        }
        setIsModalOpen(false);
      };

      // 開啟新增旅程
      const handleOpenNewTrip = () => {
        setEditingTripId(null);
        setTripFormData({
          destination: '泰國',
          name: '泰國曼谷',
          currency: 'THB',
          startDate: new Date().toISOString().split('T')[0],
          endDate: new Date().toISOString().split('T')[0]
        });
        setIsTripModalOpen(true);
      };

      // 開啟編輯當前旅程
      const handleOpenEditTrip = () => {
        if (!currentTrip) return;
        setEditingTripId(currentTrip.id);
        setTripFormData({
          destination: currentTrip.destination || '日本',
          name: currentTrip.name,
          currency: currentTrip.currency,
          startDate: currentTrip.startDate || '',
          endDate: currentTrip.endDate || ''
        });
        setIsTripModalOpen(true);
      };

      // 刪除當前旅程
      const handleDeleteCurrentTrip = () => {
        if (trips.length <= 1) {
          alert('至少需要保留一個旅程！');
          return;
        }
        if (window.confirm(`確定要刪除「${currentTrip.name}」及其所有消費記錄嗎？`)) {
          const remain = trips.filter(t => t.id !== currentTrip.id);
          setTrips(remain);
          setActiveTripId(remain[0].id);
        }
      };

      // 當選擇不同地點時，自動切換對應幣別
      const handleDestinationChange = (destName) => {
        const found = DESTINATIONS.find(d => d.name === destName);
        const curr = found ? found.currency : 'USD';
        setTripFormData(prev => ({
          ...prev,
          destination: destName,
          currency: curr,
          name: prev.name === '' || DESTINATIONS.some(d => prev.name.includes(d.name)) ? `${destName}之旅` : prev.name
        }));
      };

      // 儲存旅程 (新增或修改)
      const handleSaveTrip = (e) => {
        e.preventDefault();
        if (!tripFormData.name) return;

        if (editingTripId) {
          const updated = trips.map(t => {
            if (t.id === editingTripId) {
              return {
                ...t,
                name: tripFormData.name,
                destination: tripFormData.destination,
                currency: tripFormData.currency,
                startDate: tripFormData.startDate,
                endDate: tripFormData.endDate
              };
            }
            return t;
          });
          setTrips(updated);
        } else {
          const newTrip = {
            id: 'trip-' + Date.now(),
            name: tripFormData.name,
            destination: tripFormData.destination,
            currency: tripFormData.currency,
            startDate: tripFormData.startDate,
            endDate: tripFormData.endDate,
            expenses: []
          };
          setTrips([...trips, newTrip]);
          setActiveTripId(newTrip.id);
        }
        setIsTripModalOpen(false);
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-6">
          {/* 1. 頂部只保留一個新增旅程按鈕 */}
          <div className="bg-white/95 p-4 rounded-3xl border border-sky-100 shadow-sm flex items-center justify-between mb-4">
            <div className="flex items-center space-x-3">
              <img 
                src="icon.png" 
                alt="Logo" 
                className="w-12 h-12 rounded-2xl object-cover shadow-sm border border-amber-200 bg-amber-50"
                onError={(e) => {
                  e.target.src = 'https://api.iconify.design/twemoji:airplane.svg';
                }}
              />
              <div>
                <h1 className="text-xl font-bold text-slate-900 tracking-tight">旅遊記帳</h1>
                <p className="text-xs text-sky-600 font-medium">星展信用卡回饋 • 預付機酒歸戶</p>
              </div>
            </div>

            <button
              onClick={handleOpenNewTrip}
              className="px-4 py-2 bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 rounded-2xl text-xs font-semibold transition"
            >
              ＋ 新增旅程
            </button>
          </div>

          {/* 旅程切換與管理列 */}
          <div className="bg-white/80 p-3 rounded-2xl border border-sky-100 shadow-xs mb-3">
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center space-x-2 overflow-x-auto scrollbar-none py-1">
                <span className="text-xs text-slate-400 font-medium whitespace-nowrap">切換旅程：</span>
                {trips.map(trip => {
                  const active = trip.id === currentTrip.id;
                  return (
                    <button
                      key={trip.id}
                      onClick={() => setActiveTripId(trip.id)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition border ${
                        active 
                          ? 'bg-sky-500 text-white border-transparent shadow-xs' 
                          : 'bg-white text-slate-600 border-sky-100 hover:bg-sky-50'
                      }`}
                    >
                      {trip.name} ({trip.currency})
                    </button>
                  );
                })}
              </div>
            </div>

            {/* 旅程編輯/刪除 */}
            <div className="flex justify-between items-center pt-2 border-t border-sky-50 text-xs">
              <span className="text-slate-500">
                {currentTrip.startDate && currentTrip.endDate ? `${currentTrip.startDate} ~ ${currentTrip.endDate}` : '未設定日期'}
              </span>
              <div className="space-x-3">
                <button onClick={handleOpenEditTrip} className="text-sky-600 hover:underline font-medium">編輯旅程</button>
                <button onClick={handleDeleteCurrentTrip} className="text-rose-500 hover:underline font-medium">刪除此旅程</button>
              </div>
            </div>
          </div>

          {/* 2. 記一筆按鈕放在切換旅程的下一行 */}
          <button
            onClick={handleOpenAdd}
            className="w-full py-3 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white rounded-2xl text-sm font-bold shadow-sm transition mb-4 flex items-center justify-center space-x-1"
          >
            <span>＋ 記一筆消費</span>
          </button>

          {/* 總結指標卡 */}
          <div className="grid grid-cols-3 gap-3 mb-5">
            <div className="bg-white p-3.5 rounded-2xl border border-sky-100 shadow-xs">
              <div className="text-xs text-slate-400 font-medium">旅程總支出</div>
              <div className="text-lg font-bold text-slate-800 mt-1">${stats.total.toLocaleString()} <span className="text-[10px] font-normal text-slate-400">TWD</span></div>
            </div>
            <div className="bg-white p-3.5 rounded-2xl border border-sky-100 shadow-xs">
              <div className="text-xs text-blue-600 font-medium">提前預購 (機酒)</div>
              <div className="text-lg font-bold text-blue-900 mt-1">${stats.pre.toLocaleString()} <span className="text-[10px] font-normal text-slate-400">TWD</span></div>
            </div>
            <div className="bg-white p-3.5 rounded-2xl border border-emerald-100 shadow-xs">
              <div className="text-xs text-emerald-600 font-medium">星展回饋淨賺</div>
              <div className="text-lg font-bold text-emerald-700 mt-1">+${stats.cardNet.toLocaleString()} <span className="text-[10px] font-normal text-slate-400">TWD</span></div>
            </div>
          </div>

          {/* 消費明細 */}
          <div className="bg-white rounded-3xl border border-sky-100 p-5 shadow-xs">
            <div className="flex justify-between items-center mb-3">
              <h2 className="text-sm font-bold text-slate-800">
                【{currentTrip.name}】消費明細
              </h2>
              <span className="text-xs text-slate-400">幣別：{currentTrip.currency}</span>
            </div>

            {(!currentTrip.expenses || currentTrip.expenses.length === 0) ? (
              <div className="text-center py-10 text-xs text-slate-400">
                目前尚無紀錄，點擊上方「＋ 記一筆消費」新增機票、住宿或餐飲！
              </div>
            ) : (
              <div className="divide-y divide-sky-50">
                {currentTrip.expenses.map(ex => (
                  <div key={ex.id} className="py-3 flex items-center justify-between">
                    <div className="pr-2">
                      <div className="font-semibold text-slate-800 text-sm">{ex.title}</div>
                      <div className="text-xs text-slate-400 mt-0.5">
                        {ex.date} • {ex.category} • {ex.stage === 'pre' ? '行前預付' : '當地開銷'}
                      </div>
                    </div>

                    <div className="flex items-center space-x-3">
                      <div className="text-right">
                        <div className="font-bold text-slate-900 text-sm">${toTWD(ex).toLocaleString()} TWD</div>
                        {ex.currency !== 'TWD' && (
                          <div className="text-[11px] text-slate-400">
                            {ex.currency} {ex.origAmount} (匯率 {ex.rate})
                          </div>
                        )}
                      </div>

                      {/* 6. 圖示改成文字：編輯、刪除 */}
                      <div className="flex items-center space-x-1.5 pl-1">
                        <button
                          onClick={() => handleOpenEdit(ex)}
                          className="px-2 py-1 text-sky-600 hover:bg-sky-50 border border-sky-200 rounded-lg text-xs font-medium transition"
                        >
                          編輯
                        </button>
                        <button
                          onClick={() => handleDeleteExpense(ex.id, ex.title)}
                          className="px-2 py-1 text-rose-600 hover:bg-rose-50 border border-rose-200 rounded-lg text-xs font-medium transition"
                        >
                          刪除
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* 彈窗：記一筆消費 / 編輯消費 */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-sky-100 text-xs">
                <div className="flex justify-between items-center pb-3 border-b border-sky-100">
                  <h3 className="font-bold text-base text-slate-900">
                    {editingId ? '編輯消費紀錄' : '記一筆消費'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 text-sm">✕</button>
                </div>

                <form onSubmit={handleSaveExpense} className="mt-4 space-y-3">
                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">品項名稱</label>
                    <input
                      type="text"
                      required
                      placeholder="例：酷航機票、飯店、晚餐"
                      value={formData.title}
                      onChange={e => setFormData({ ...formData, title: e.target.value })}
                      className="w-full box-border bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">階段</label>
                      <select
                        value={formData.stage}
                        onChange={e => setFormData({ ...formData, stage: e.target.value })}
                        className="w-full box-border bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      >
                        <option value="pre">行前預付</option>
                        <option value="local">當地開銷</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">類別</label>
                      <select
                        value={formData.category}
                        onChange={e => setFormData({ ...formData, category: e.target.value })}
                        className="w-full box-border bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      >
                        <option value="機票">機票</option>
                        <option value="住宿">住宿</option>
                        <option value="餐飲">餐飲</option>
                        <option value="交通">交通</option>
                        <option value="購物">購物</option>
                        <option value="門票娛樂">門票娛樂</option>
                        <option value="其他">其他</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      {/* 7. 當前旅程外幣自動連動 */}
                      <label className="block text-slate-600 mb-1 font-semibold">幣別</label>
                      <select
                        value={formData.currency}
                        onChange={e => setFormData({ ...formData, currency: e.target.value })}
                        className="w-full box-border bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      >
                        <option value={currentTrip.currency}>{currentTrip.currency} 當地外幣</option>
                        <option value="TWD">TWD 台幣</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">金額</label>
                      <input
                        type="number"
                        required
                        placeholder="0"
                        value={formData.origAmount}
                        onChange={e => setFormData({ ...formData, origAmount: e.target.value })}
                        className="w-full box-border bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  </div>

                  {/* 3. 匯率不在旅程固定，而在外幣記帳時直接填當筆匯率 */}
                  {formData.currency !== 'TWD' && (
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">
                        當筆外幣匯率換算成 TWD
                      </label>
                      <input
                        type="number"
                        step="0.0001"
                        required
                        placeholder="如：0.95 或 0.22"
                        value={formData.rate}
                        onChange={e => setFormData({ ...formData, rate: e.target.value })}
                        className="w-full box-border bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  )}

                  {/* 5. 修復日期框寬度溢出問題 */}
                  <div className="w-full">
                    <label className="block text-slate-600 mb-1 font-semibold">日期</label>
                    <input
                      type="date"
                      required
                      value={formData.date}
                      onChange={e => setFormData({ ...formData, date: e.target.value })}
                      className="w-full max-w-full box-border bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">星展信用卡</label>
                    <select
                      value={formData.cardId}
                      onChange={e => setFormData({ ...formData, cardId: e.target.value })}
                      className="w-full box-border bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                    >
                      {DBS_CARDS.map(c => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="pt-3 flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 text-slate-400 font-medium"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-xl font-semibold shadow-sm"
                    >
                      {editingId ? '確認儲存' : '儲存'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 3 & 4. 旅程 Modal：選地點、時間，支援新增與修改 */}
          {isTripModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-sky-100 text-xs">
                <div className="flex justify-between items-center pb-3 border-b border-sky-100">
                  <h3 className="font-bold text-base text-slate-900">
                    {editingTripId ? '編輯旅程' : '新增旅程'}
                  </h3>
                  <button onClick={() => setIsTripModalOpen(false)} className="text-slate-400 text-sm">✕</button>
                </div>

                <form onSubmit={handleSaveTrip} className="mt-4 space-y-3">
                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">選擇目的地 / 國家</label>
                    <select
                      value={tripFormData.destination}
                      onChange={e => handleDestinationChange(e.target.value)}
                      className="w-full box-border bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800"
                    >
                      {DESTINATIONS.map(d => (
                        <option key={d.name} value={d.name}>
                          {d.name} ({d.currency})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">旅程顯示名稱</label>
                    <input
                      type="text"
                      required
                      placeholder="例：2026/12 泰國曼谷避冬"
                      value={tripFormData.name}
                      onChange={e => setTripFormData({ ...tripFormData, name: e.target.value })}
                      className="w-full box-border bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">開始日期</label>
                      <input
                        type="date"
                        required
                        value={tripFormData.startDate}
                        onChange={e => setTripFormData({ ...tripFormData, startDate: e.target.value })}
                        className="w-full max-w-full box-border bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">結束日期</label>
                      <input
                        type="date"
                        required
                        value={tripFormData.endDate}
                        onChange={e => setTripFormData({ ...tripFormData, endDate: e.target.value })}
                        className="w-full max-w-full box-border bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">綁定外幣代號</label>
                    <input
                      type="text"
                      readOnly
                      value={tripFormData.currency}
                      className="w-full box-border bg-slate-100 text-slate-500 border border-sky-100 rounded-xl px-3 py-2 cursor-not-allowed font-semibold"
                    />
                    <p className="text-[10px] text-slate-400 mt-1">＊系統已自動連動幣別，每筆花費可於記帳時個別調整當日匯率。</p>
                  </div>

                  <div className="pt-3 flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setIsTripModalOpen(false)}
                      className="px-4 py-2 text-slate-400"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-xl font-semibold shadow-sm"
                    >
                      {editingTripId ? '儲存變更' : '建立旅程'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
