<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅遊記帳</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅遊記帳">

  <!-- Tailwind CSS 與 React -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-50 via-blue-50/40 to-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 將布丁狗旅行插圖轉為高畫質向量/內嵌畫布，免除任何圖片路徑失效問題
    const PompompurinIcon = ({ className = "w-12 h-12" }) => (
      <svg className={`${className} rounded-2xl shadow-sm border border-amber-200 overflow-hidden shrink-0`} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        {/* 背景 */}
        <rect width="200" height="200" rx="42" fill="#FFFBEB"/>
        <rect x="2" y="2" width="196" height="196" rx="40" stroke="#FDE68A" strokeWidth="4"/>
        
        {/* 左上地球儀 */}
        <circle cx="48" cy="46" r="24" fill="#86EFAC" stroke="#15803D" strokeWidth="4.5"/>
        <path d="M38 34C48 38 52 30 58 42C62 50 54 58 44 60" stroke="#38BDF8" strokeWidth="5.5" strokeLinecap="round"/>
        <circle cx="40" cy="54" r="3" fill="#38BDF8"/>
        
        {/* 右上飛機與軌跡 */}
        <path d="M118 42C126 38 134 36 142 36" stroke="#FBBF24" strokeWidth="3.5" strokeDasharray="4 4" strokeLinecap="round"/>
        <path d="M140 38L166 28L174 42L148 46Z" fill="#F0F9FF" stroke="#0369A1" strokeWidth="4" strokeLinejoin="round"/>
        <circle cx="156" cy="36" r="2.5" fill="#0284C7"/>
        <circle cx="163" cy="34" r="2.5" fill="#0284C7"/>

        {/* 左側金幣堆 */}
        <g>
          <ellipse cx="42" cy="156" rx="16" ry="8" fill="#FACC15" stroke="#713F12" strokeWidth="4"/>
          <ellipse cx="42" cy="148" rx="16" ry="8" fill="#FDE047" stroke="#713F12" strokeWidth="4"/>
          <ellipse cx="42" cy="140" rx="16" ry="8" fill="#FEF08A" stroke="#713F12" strokeWidth="4"/>
          <path d="M42 136V144M38 140H46" stroke="#713F12" strokeWidth="3" strokeLinecap="round"/>
        </g>

        {/* 右側粉紅行李箱 */}
        <g>
          <path d="M152 118V108H164V118" stroke="#475569" strokeWidth="4" strokeLinecap="round"/>
          <rect x="142" y="118" width="34" height="48" rx="8" fill="#F472B6" stroke="#713F12" strokeWidth="4.5"/>
          <circle cx="159" cy="140" r="5" fill="#FFFFFF"/>
          <circle cx="153" cy="133" r="2.5" fill="#FFFFFF"/>
          <circle cx="159" cy="131" r="2.5" fill="#FFFFFF"/>
          <circle cx="165" cy="133" r="2.5" fill="#FFFFFF"/>
          <circle cx="148" cy="167" r="3.5" fill="#334155"/>
          <circle cx="170" cy="167" r="3.5" fill="#334155"/>
        </g>

        {/* 布丁狗本體 */}
        {/* 耳朵 */}
        <ellipse cx="62" cy="88" rx="18" ry="30" fill="#FDE047" stroke="#713F12" strokeWidth="6" transform="rotate(-25 62 88)"/>
        <ellipse cx="138" cy="88" rx="18" ry="30" fill="#FDE047" stroke="#713F12" strokeWidth="6" transform="rotate(25 138 88)"/>
        {/* 身體與臉 */}
        <ellipse cx="100" cy="128" rx="42" ry="38" fill="#FEF08A" stroke="#713F12" strokeWidth="6"/>
        <circle cx="100" cy="104" r="48" fill="#FEF08A" stroke="#713F12" strokeWidth="6"/>
        {/* 雙腳 */}
        <ellipse cx="76" cy="164" rx="12" ry="9" fill="#FEF08A" stroke="#713F12" strokeWidth="5"/>
        <ellipse cx="124" cy="164" rx="12" ry="9" fill="#FEF08A" stroke="#713F12" strokeWidth="5"/>
        {/* 棕色貝雷帽 */}
        <ellipse cx="100" cy="58" rx="30" ry="15" fill="#78350F" stroke="#451A03" strokeWidth="4.5"/>
        <path d="M100 44V50" stroke="#78350F" strokeWidth="5" strokeLinecap="round"/>
        {/* 臉部五官 */}
        <ellipse cx="78" cy="98" rx="4.5" ry="5.5" fill="#713F12"/>
        <ellipse cx="122" cy="98" rx="4.5" ry="5.5" fill="#713F12"/>
        <ellipse cx="100" cy="107" rx="7" ry="5" fill="#713F12"/>
        <path d="M92 113C96 117 100 117 100 113C100 117 104 117 108 113" stroke="#713F12" strokeWidth="4.5" strokeLinecap="round"/>

        {/* 雙手抱著的旅行地圖 */}
        <g>
          <path d="M70 128L98 116L126 128L100 142Z" fill="#BAE6FD" stroke="#0284C7" strokeWidth="4.5" strokeLinejoin="round"/>
          <circle cx="98" cy="128" r="4.5" fill="#EF4444"/>
          {/* 小狗手手 */}
          <ellipse cx="68" cy="132" rx="7" ry="9" fill="#FEF08A" stroke="#713F12" strokeWidth="4.5"/>
          <ellipse cx="130" cy="132" rx="7" ry="9" fill="#FEF08A" stroke="#713F12" strokeWidth="4.5"/>
        </g>
      </svg>
    );

    const DBS_CARDS = [
      { id: 'dbs-eco', name: '星展 eco 永續卡 (日韓歐美 5%)', rate: 5.0, fee: 1.5 },
      { id: 'dbs-eco-general', name: '星展 eco 永續卡 (一般海外 1.5%)', rate: 1.5, fee: 1.5 },
      { id: 'dbs-flight', name: '星展 飛行世界卡 (哩程累積)', rate: 3.3, fee: 1.5 },
      { id: 'dbs-everyday', name: '星展 everyday 卡', rate: 3.0, fee: 1.5 }
    ];

    const DEFAULT_TRIPS = [
      {
        id: 'trip-1',
        name: '2026/11 日本東京',
        currency: 'JPY',
        rate: 0.22,
        expenses: []
      }
    ];

    function App() {
      const [trips, setTrips] = useState(() => {
        try {
          const saved = localStorage.getItem('TRAVEL_APP_TRIPS_V4');
          return saved ? JSON.parse(saved) : DEFAULT_TRIPS;
        } catch (e) {
          return DEFAULT_TRIPS;
        }
      });
      const [activeTripId, setActiveTripId] = useState(trips[0]?.id || '');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [isNewTripModalOpen, setIsNewTripModalOpen] = useState(false);

      const currentTrip = trips.find(t => t.id === activeTripId) || trips[0];

      useEffect(() => {
        localStorage.setItem('TRAVEL_APP_TRIPS_V4', JSON.stringify(trips));
      }, [trips]);

      const [formData, setFormData] = useState({
        title: '',
        category: '機票',
        stage: 'pre',
        currency: 'JPY',
        origAmount: '',
        date: new Date().toISOString().split('T')[0],
        cardId: 'dbs-eco',
        payer: '我'
      });

      const [newTripData, setNewTripData] = useState({
        name: '',
        currency: 'JPY',
        rate: 0.22
      });

      const toTWD = (item) => {
        if (item.currency === 'TWD') return Number(item.origAmount || 0);
        const rate = currentTrip?.rate || 0.22;
        return Math.round(Number(item.origAmount || 0) * rate);
      };

      const stats = useMemo(() => {
        if (!currentTrip) return { total: 0, pre: 0, cardNet: 0 };
        let total = 0, pre = 0, cardNet = 0;
        (currentTrip.expenses || []).forEach(ex => {
          const val = toTWD(ex);
          total += val;
          if (ex.stage === 'pre') pre += val;
          const card = DBS_CARDS.find(c => c.id === ex.cardId) || DBS_CARDS[0];
          cardNet += Math.round(val * ((card.rate - card.fee) / 100));
        });
        return { total, pre, cardNet };
      }, [currentTrip]);

      const handleOpenAdd = () => {
        setEditingId(null);
        setFormData({
          title: '',
          category: '機票',
          stage: 'pre',
          currency: currentTrip ? currentTrip.currency : 'JPY',
          origAmount: '',
          date: new Date().toISOString().split('T')[0],
          cardId: 'dbs-eco',
          payer: '我'
        });
        setIsModalOpen(true);
      };

      const handleOpenEdit = (expense) => {
        setEditingId(expense.id);
        setFormData({
          title: expense.title,
          category: expense.category,
          stage: expense.stage,
          currency: expense.currency,
          origAmount: expense.origAmount.toString(),
          date: expense.date,
          cardId: expense.cardId || 'dbs-eco',
          payer: expense.payer || '我'
        });
        setIsModalOpen(true);
      };

      const handleDeleteExpense = (id, title) => {
        if (window.confirm(`確定要刪除「${title}」這筆紀錄嗎？`)) {
          const updated = trips.map(t => {
            if (t.id === currentTrip.id) {
              return { ...t, expenses: t.expenses.filter(e => e.id !== id) };
            }
            return t;
          });
          setTrips(updated);
        }
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.origAmount) return;

        if (editingId) {
          const updated = trips.map(t => {
            if (t.id === currentTrip.id) {
              const newExpenses = t.expenses.map(exp => {
                if (exp.id === editingId) {
                  return { ...exp, ...formData, origAmount: parseFloat(formData.origAmount) };
                }
                return exp;
              });
              return { ...t, expenses: newExpenses };
            }
            return t;
          });
          setTrips(updated);
        } else {
          const newEntry = {
            id: 'exp-' + Date.now(),
            ...formData,
            origAmount: parseFloat(formData.origAmount)
          };
          const updated = trips.map(t => {
            if (t.id === currentTrip.id) {
              return { ...t, expenses: [newEntry, ...(t.expenses || [])] };
            }
            return t;
          });
          setTrips(updated);
        }

        setIsModalOpen(false);
      };

      const handleCreateTrip = (e) => {
        e.preventDefault();
        if (!newTripData.name) return;

        const newTrip = {
          id: 'trip-' + Date.now(),
          name: newTripData.name,
          currency: newTripData.currency || 'JPY',
          rate: parseFloat(newTripData.rate) || 0.22,
          expenses: []
        };

        setTrips([...trips, newTrip]);
        setActiveTripId(newTrip.id);
        setIsNewTripModalOpen(false);
        setNewTripData({ name: '', currency: 'JPY', rate: 0.22 });
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-6">
          {/* 頂部導航列 */}
          <div className="bg-white/95 p-4 rounded-3xl border border-sky-100 shadow-sm flex items-center justify-between mb-4">
            <div className="flex items-center space-x-3">
              <PompompurinIcon className="w-12 h-12" />
              <div>
                <h1 className="text-xl font-bold text-slate-900 tracking-tight">旅遊記帳</h1>
                <p className="text-xs text-sky-600 font-medium">星展信用卡回饋 • 預付機酒歸戶</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={() => setIsNewTripModalOpen(true)}
                className="px-3.5 py-2 bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 rounded-2xl text-xs font-semibold transition"
              >
                ＋ 新旅程
              </button>
              <button
                onClick={handleOpenAdd}
                className="px-4 py-2 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white rounded-2xl text-xs font-semibold shadow-sm transition"
              >
                ＋ 記一筆
              </button>
            </div>
          </div>

          {/* 旅程切換列 */}
          <div className="flex items-center space-x-2 overflow-x-auto scrollbar-none pb-2 mb-4">
            <span className="text-xs text-slate-400 font-medium whitespace-nowrap pl-1">切換旅程：</span>
            {trips.map(trip => {
              const active = trip.id === currentTrip?.id;
              return (
                <button
                  key={trip.id}
                  onClick={() => setActiveTripId(trip.id)}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition border ${
                    active 
                      ? 'bg-sky-500 text-white border-transparent shadow-xs' 
                      : 'bg-white text-slate-600 border-sky-100 hover:bg-sky-50'
                  }`}
                >
                  {trip.name} ({trip.currency})
                </button>
              );
            })}
          </div>

          {/* 總結指標卡 */}
          <div className="grid grid-cols-3 gap-3 mb-6">
            <div className="bg-white p-4 rounded-2xl border border-sky-100 shadow-xs">
              <div className="text-xs text-slate-400 font-medium">旅程總支出</div>
              <div className="text-xl font-bold text-slate-800 mt-1">${stats.total.toLocaleString()} <span className="text-xs font-normal text-slate-400">TWD</span></div>
            </div>
            <div className="bg-white p-4 rounded-2xl border border-sky-100 shadow-xs">
              <div className="text-xs text-blue-600 font-medium">提前預購 (機酒)</div>
              <div className="text-xl font-bold text-blue-900 mt-1">${stats.pre.toLocaleString()} <span className="text-xs font-normal text-slate-400">TWD</span></div>
            </div>
            <div className="bg-white p-4 rounded-2xl border border-emerald-100 shadow-xs">
              <div className="text-xs text-emerald-600 font-medium">星展回饋淨賺</div>
              <div className="text-xl font-bold text-emerald-700 mt-1">+${stats.cardNet.toLocaleString()} <span className="text-xs font-normal text-slate-400">TWD</span></div>
            </div>
          </div>

          {/* 消費明細 */}
          <div className="bg-white rounded-3xl border border-sky-100 p-5 shadow-xs">
            <div className="flex justify-between items-center mb-3">
              <h2 className="text-sm font-bold text-slate-800">
                【{currentTrip?.name}】消費明細
              </h2>
              <span className="text-xs text-slate-400">匯率：{currentTrip?.rate || 0.22}</span>
            </div>

            {(!currentTrip?.expenses || currentTrip.expenses.length === 0) ? (
              <div className="text-center py-12 text-xs text-slate-400">
                目前尚無紀錄，點擊右上角「＋ 記一筆」新增機票或住宿！
              </div>
            ) : (
              <div className="divide-y divide-sky-50">
                {currentTrip.expenses.map(ex => (
                  <div key={ex.id} className="py-3 flex items-center justify-between group">
                    <div className="pr-2">
                      <div className="font-semibold text-slate-800 text-sm">{ex.title}</div>
                      <div className="text-xs text-slate-400 mt-0.5">
                        {ex.date} • {ex.category} • {ex.stage === 'pre' ? '行前預購' : '當地支出'}
                      </div>
                    </div>

                    <div className="flex items-center space-x-3">
                      <div className="text-right">
                        <div className="font-bold text-slate-900 text-sm">${toTWD(ex).toLocaleString()} TWD</div>
                        {ex.currency !== 'TWD' && (
                          <div className="text-xs text-slate-400">{ex.currency} {ex.origAmount}</div>
                        )}
                      </div>

                      <div className="flex items-center space-x-1 pl-1">
                        <button
                          onClick={() => handleOpenEdit(ex)}
                          title="修改"
                          className="p-1.5 text-slate-400 hover:text-sky-600 hover:bg-sky-50 rounded-lg transition"
                        >
                          ✏️
                        </button>
                        <button
                          onClick={() => handleDeleteExpense(ex.id, ex.title)}
                          title="刪除"
                          className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition"
                        >
                          🗑️
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* 彈窗 1：新增 / 修改消費 */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-sky-100 text-xs">
                <div className="flex justify-between items-center pb-3 border-b border-sky-100">
                  <h3 className="font-bold text-base text-slate-900">
                    {editingId ? '修改消費紀錄' : '記一筆消費'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 text-sm">✕</button>
                </div>

                <form onSubmit={handleSave} className="mt-4 space-y-3">
                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">品項名稱</label>
                    <input
                      type="text"
                      required
                      placeholder="例：酷航機票、新宿飯店"
                      value={formData.title}
                      onChange={e => setFormData({ ...formData, title: e.target.value })}
                      className="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">階段</label>
                      <select
                        value={formData.stage}
                        onChange={e => setFormData({ ...formData, stage: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      >
                        <option value="pre">行前預付</option>
                        <option value="local">當地開銷</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">類別</label>
                      <select
                        value={formData.category}
                        onChange={e => setFormData({ ...formData, category: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      >
                        <option value="機票">機票</option>
                        <option value="住宿">住宿</option>
                        <option value="食">食</option>
                        <option value="交通">交通</option>
                        <option value="娛樂">娛樂</option>
                        <option value="衣服">衣服</option>
                        <option value="其他">其他</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">幣別</label>
                      <select
                        value={formData.currency}
                        onChange={e => setFormData({ ...formData, currency: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      >
                        <option value={currentTrip?.currency || 'JPY'}>{currentTrip?.currency || 'JPY'} 當地外幣</option>
                        <option value="TWD">TWD 台幣</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">金額</label>
                      <input
                        type="number"
                        required
                        placeholder="0"
                        value={formData.origAmount}
                        onChange={e => setFormData({ ...formData, origAmount: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">日期</label>
                    <input
                      type="date"
                      required
                      value={formData.date}
                      onChange={e => setFormData({ ...formData, date: e.target.value })}
                      className="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">星展信用卡</label>
                    <select
                      value={formData.cardId}
                      onChange={e => setFormData({ ...formData, cardId: e.target.value })}
                      className="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                    >
                      {DBS_CARDS.map(c => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                    </select>
                  </div>

                  <div className="pt-3 flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 text-slate-400 font-medium"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-xl font-semibold shadow-sm"
                    >
                      {editingId ? '確認更新' : '儲存'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 彈窗 2：新增新旅程 */}
          {isNewTripModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-sky-100 text-xs">
                <div className="flex justify-between items-center pb-3 border-b border-sky-100">
                  <h3 className="font-bold text-base text-slate-900">規劃新旅程</h3>
                  <button onClick={() => setIsNewTripModalOpen(false)} className="text-slate-400 text-sm">✕</button>
                </div>

                <form onSubmit={handleCreateTrip} className="mt-4 space-y-3">
                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">旅程名稱</label>
                    <input
                      type="text"
                      required
                      placeholder="例：2026/12 泰國曼谷"
                      value={newTripData.name}
                      onChange={e => setNewTripData({ ...newTripData, name: e.target.value })}
                      className="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">外幣代碼</label>
                      <input
                        type="text"
                        placeholder="THB, JPY, EUR..."
                        value={newTripData.currency}
                        onChange={e => setNewTripData({ ...newTripData, currency: e.target.value.toUpperCase() })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">預估匯率</label>
                      <input
                        type="number"
                        step="0.0001"
                        placeholder="0.95"
                        value={newTripData.rate}
                        onChange={e => setNewTripData({ ...newTripData, rate: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  </div>

                  <div className="pt-3 flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setIsNewTripModalOpen(false)}
                      className="px-4 py-2 text-slate-400"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-xl font-semibold"
                    >
                      建立
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
