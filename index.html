<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅遊記帳</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="旅遊記帳">
  <link rel="apple-touch-icon" href="https://i.ibb.co/ymkR6Tpk/Gemini-Generated-Image-tj8q2itj8q2itj8q.jpg">
  <link rel="icon" type="image/jpeg" href="https://i.ibb.co/ymkR6Tpk/Gemini-Generated-Image-tj8q2itj8q2itj8q.jpg">

  <!-- Tailwind CSS 與 React -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-50 via-blue-50/40 to-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const APP_ICON_URL = "https://i.ibb.co/ymkR6Tpk/Gemini-Generated-Image-tj8q2itj8q2itj8q.jpg";

    const DEFAULT_PAY_METHODS = [
      { id: 'dbs-eco', name: '星展 eco 永續卡', rate: 5.0, fee: 1.5, isCard: true },
      { id: 'cash', name: '現金', rate: 0, fee: 0, isCard: false }
    ];

    const DEFAULT_TRIPS = [
      {
        id: 'trip-1',
        name: '2026/11 日本東京',
        currency: 'JPY',
        rate: 0.22,
        expenses: []
      },
      {
        id: 'trip-2',
        name: '2026/12 泰國曼谷',
        currency: 'THB',
        rate: 0.95,
        expenses: []
      }
    ];

    // 單筆消費元件：支援手機/電腦左右滑動露出刪除按鈕
    function ExpenseItem({ ex, toTWD, onEdit, onDelete }) {
      const [offsetX, setOffsetX] = useState(0);
      const [isOpen, setIsOpen] = useState(false);
      const startXRef = useRef(0);
      const isDraggingRef = useRef(false);

      const handleTouchStart = (e) => {
        startXRef.current = e.touches[0].clientX;
        isDraggingRef.current = true;
      };

      const handleTouchMove = (e) => {
        if (!isDraggingRef.current) return;
        const currentX = e.touches[0].clientX;
        const diff = currentX - startXRef.current;
        if (isOpen) {
          if (diff > 0 && diff <= 80) setOffsetX(-80 + diff);
        } else {
          if (diff < 0 && diff >= -90) setOffsetX(diff);
        }
      };

      const handleTouchEnd = () => {
        isDraggingRef.current = false;
        if (offsetX < -40) {
          setOffsetX(-76);
          setIsOpen(true);
        } else {
          setOffsetX(0);
          setIsOpen(false);
        }
      };

      return (
        <div className="relative overflow-hidden border-b border-sky-50 last:border-b-0 bg-rose-500">
          <div className="absolute inset-y-0 right-0 w-20 flex items-center justify-center">
            <button
              onClick={() => {
                setOffsetX(0);
                setIsOpen(false);
                onDelete(ex.id, ex.title);
              }}
              className="w-full h-full bg-rose-600 hover:bg-rose-700 text-white font-medium text-xs flex items-center justify-center transition"
            >
              刪除
            </button>
          </div>

          <div
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            style={{ transform: `translateX(${offsetX}px)` }}
            className="p-4 bg-white transition-transform duration-150 ease-out flex items-center justify-between select-none"
          >
            <div className="pr-2">
              <div className="font-semibold text-slate-800 text-sm">{ex.title}</div>
              <div className="text-xs text-slate-400 mt-0.5">
                {ex.date} • {ex.category} • {ex.stage === 'pre' ? '行前預購' : '當地支出'} • {ex.payMethodName || '星展 eco 永續卡'}
              </div>
            </div>

            <div className="flex items-center space-x-3 shrink-0">
              <div className="text-right">
                <div className="font-bold text-slate-900 text-sm">${toTWD(ex).toLocaleString()} TWD</div>
                {ex.currency !== 'TWD' && (
                  <div className="text-xs text-slate-400">{ex.currency} {ex.origAmount}</div>
                )}
              </div>

              <button
                onClick={(e) => {
                  e.stopPropagation();
                  onEdit(ex);
                }}
                className="text-xs text-slate-400 hover:text-slate-600 px-2 py-1 rounded-lg hover:bg-slate-50 transition font-normal"
              >
                編輯
              </button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [trips, setTrips] = useState(() => {
        try {
          const saved = localStorage.getItem('TRAVEL_APP_TRIPS_V9');
          return saved ? JSON.parse(saved) : DEFAULT_TRIPS;
        } catch (e) {
          return DEFAULT_TRIPS;
        }
      });

      const [payMethods, setPayMethods] = useState(() => {
        try {
          const saved = localStorage.getItem('TRAVEL_APP_PAY_METHODS_V2');
          return saved ? JSON.parse(saved) : DEFAULT_PAY_METHODS;
        } catch (e) {
          return DEFAULT_PAY_METHODS;
        }
      });

      const [activeTripId, setActiveTripId] = useState(trips[0]?.id || '');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [isNewTripModalOpen, setIsNewTripModalOpen] = useState(false);
      const [isNewPayMethodModalOpen, setIsNewPayMethodModalOpen] = useState(false);
      const [isTripCatalogOpen, setIsTripCatalogOpen] = useState(false); // 旅程目錄開關

      const currentTrip = trips.find(t => t.id === activeTripId) || trips[0];

      useEffect(() => {
        localStorage.setItem('TRAVEL_APP_TRIPS_V9', JSON.stringify(trips));
      }, [trips]);

      useEffect(() => {
        localStorage.setItem('TRAVEL_APP_PAY_METHODS_V2', JSON.stringify(payMethods));
      }, [payMethods]);

      const [formData, setFormData] = useState({
        title: '',
        category: '機票',
        stage: 'pre',
        currency: 'JPY',
        origAmount: '',
        date: new Date().toISOString().split('T')[0],
        payMethodId: 'dbs-eco',
        payer: '我'
      });

      const [newTripData, setNewTripData] = useState({
        name: '',
        currency: 'JPY',
        rate: 0.22
      });

      const [newPayMethodData, setNewPayMethodData] = useState({
        name: '',
        rate: 0,
        fee: 0,
        isCard: false
      });

      const toTWD = (item, trip = currentTrip) => {
        if (!item) return 0;
        if (item.currency === 'TWD') return Number(item.origAmount || 0);
        const rate = trip?.rate || 0.22;
        return Math.round(Number(item.origAmount || 0) * rate);
      };

      const stats = useMemo(() => {
        if (!currentTrip) return { total: 0, pre: 0, cardNet: 0 };
        let total = 0, pre = 0, cardNet = 0;
        (currentTrip.expenses || []).forEach(ex => {
          const val = toTWD(ex);
          total += val;
          if (ex.stage === 'pre') pre += val;
          const method = payMethods.find(m => m.id === ex.payMethodId);
          if (method && method.isCard) {
            cardNet += Math.round(val * ((method.rate - method.fee) / 100));
          }
        });
        return { total, pre, cardNet };
      }, [currentTrip, payMethods]);

      const handleOpenAdd = () => {
        setEditingId(null);
        setFormData({
          title: '',
          category: '機票',
          stage: 'pre',
          currency: currentTrip ? currentTrip.currency : 'JPY',
          origAmount: '',
          date: new Date().toISOString().split('T')[0],
          payMethodId: payMethods[0]?.id || 'dbs-eco',
          payer: '我'
        });
        setIsModalOpen(true);
      };

      const handleOpenEdit = (expense) => {
        setEditingId(expense.id);
        setFormData({
          title: expense.title,
          category: expense.category,
          stage: expense.stage,
          currency: expense.currency,
          origAmount: expense.origAmount.toString(),
          date: expense.date,
          payMethodId: expense.payMethodId || 'dbs-eco',
          payer: expense.payer || '我'
        });
        setIsModalOpen(true);
      };

      const handleDeleteExpense = (id, title) => {
        if (window.confirm(`確定要刪除「${title}」這筆紀錄嗎？`)) {
          const updated = trips.map(t => {
            if (t.id === currentTrip.id) {
              return { ...t, expenses: t.expenses.filter(e => e.id !== id) };
            }
            return t;
          });
          setTrips(updated);
        }
      };

      const handleSave = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.origAmount) return;

        const currentMethod = payMethods.find(m => m.id === formData.payMethodId);

        if (editingId) {
          const updated = trips.map(t => {
            if (t.id === currentTrip.id) {
              const newExpenses = t.expenses.map(exp => {
                if (exp.id === editingId) {
                  return { 
                    ...exp, 
                    ...formData, 
                    origAmount: parseFloat(formData.origAmount),
                    payMethodName: currentMethod?.name || '星展 eco 永續卡'
                  };
                }
                return exp;
              });
              return { ...t, expenses: newExpenses };
            }
            return t;
          });
          setTrips(updated);
        } else {
          const newEntry = {
            id: 'exp-' + Date.now(),
            ...formData,
            origAmount: parseFloat(formData.origAmount),
            payMethodName: currentMethod?.name || '星展 eco 永續卡'
          };
          const updated = trips.map(t => {
            if (t.id === currentTrip.id) {
              return { ...t, expenses: [newEntry, ...(t.expenses || [])] };
            }
            return t;
          });
          setTrips(updated);
        }

        setIsModalOpen(false);
      };

      const handleCreateTrip = (e) => {
        e.preventDefault();
        if (!newTripData.name) return;

        const newTrip = {
          id: 'trip-' + Date.now(),
          name: newTripData.name,
          currency: newTripData.currency || 'JPY',
          rate: parseFloat(newTripData.rate) || 0.22,
          expenses: []
        };

        setTrips([...trips, newTrip]);
        setActiveTripId(newTrip.id);
        setIsNewTripModalOpen(false);
        setNewTripData({ name: '', currency: 'JPY', rate: 0.22 });
      };

      const handleCreatePayMethod = (e) => {
        e.preventDefault();
        if (!newPayMethodData.name) return;

        const newMethod = {
          id: 'pay-' + Date.now(),
          name: newPayMethodData.name,
          rate: parseFloat(newPayMethodData.rate) || 0,
          fee: parseFloat(newPayMethodData.fee) || 0,
          isCard: newPayMethodData.isCard
        };

        const updated = [...payMethods, newMethod];
        setPayMethods(updated);
        setFormData(prev => ({ ...prev, payMethodId: newMethod.id }));
        setIsNewPayMethodModalOpen(false);
        setNewPayMethodData({ name: '', rate: 0, fee: 0, isCard: false });
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-6">
          {/* 頂部導航列：右上角只留「＋ 新旅程」與「目錄」按鈕 */}
          <div className="bg-white/95 p-4 rounded-3xl border border-sky-100 shadow-sm flex items-center justify-between mb-4">
            <div className="flex items-center space-x-3">
              <img 
                src={APP_ICON_URL} 
                alt="Logo" 
                className="w-12 h-12 rounded-2xl object-cover shadow-sm border border-amber-200"
              />
              <div>
                <h1 className="text-xl font-bold text-slate-900 tracking-tight">旅遊記帳</h1>
                <p className="text-xs text-sky-600 font-medium">星展信用卡回饋 • 預付機酒歸戶</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={() => setIsTripCatalogOpen(true)}
                className="px-3 py-2 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-2xl text-xs font-semibold transition flex items-center space-x-1"
                title="查看過往與所有旅程目錄"
              >
                <span>☰ 目錄</span>
              </button>
              <button
                onClick={() => setIsNewTripModalOpen(true)}
                className="px-3.5 py-2 bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200 rounded-2xl text-xs font-semibold transition"
              >
                ＋ 新旅程
              </button>
            </div>
          </div>

          {/* 橫向切換旅程列 */}
          <div className="flex items-center space-x-2 overflow-x-auto scrollbar-none pb-2 mb-3">
            <span className="text-xs text-slate-400 font-medium whitespace-nowrap pl-1">切換旅程：</span>
            {trips.map(trip => {
              const active = trip.id === currentTrip?.id;
              return (
                <button
                  key={trip.id}
                  onClick={() => setActiveTripId(trip.id)}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition border ${
                    active 
                      ? 'bg-sky-500 text-white border-transparent shadow-xs' 
                      : 'bg-white text-slate-600 border-sky-100 hover:bg-sky-50'
                  }`}
                >
                  {trip.name} ({trip.currency})
                </button>
              );
            })}
          </div>

          {/* 切換旅程下一行：【＋ 記一筆】顯眼大按鈕 */}
          <div className="mb-6">
            <button
              onClick={handleOpenAdd}
              className="w-full py-3 bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white rounded-2xl text-sm font-semibold shadow-md shadow-sky-200/60 transition flex items-center justify-center space-x-2 active:scale-[0.99]"
            >
              <span className="text-base leading-none">＋</span>
              <span>為【{currentTrip?.name}】記一筆消費</span>
            </button>
          </div>

          {/* 總結指標卡 */}
          <div className="grid grid-cols-3 gap-3 mb-6">
            <div className="bg-white p-4 rounded-2xl border border-sky-100 shadow-xs">
              <div className="text-xs text-slate-400 font-medium">旅程總支出</div>
              <div className="text-xl font-bold text-slate-800 mt-1">${stats.total.toLocaleString()} <span className="text-xs font-normal text-slate-400">TWD</span></div>
            </div>
            <div className="bg-white p-4 rounded-2xl border border-sky-100 shadow-xs">
              <div className="text-xs text-blue-600 font-medium">提前預購 (機酒)</div>
              <div className="text-xl font-bold text-blue-900 mt-1">${stats.pre.toLocaleString()} <span className="text-xs font-normal text-slate-400">TWD</span></div>
            </div>
            <div className="bg-white p-4 rounded-2xl border border-emerald-100 shadow-xs">
              <div className="text-xs text-emerald-600 font-medium">星展回饋淨賺</div>
              <div className="text-xl font-bold text-emerald-700 mt-1">+${stats.cardNet.toLocaleString()} <span className="text-xs font-normal text-slate-400">TWD</span></div>
            </div>
          </div>

          {/* 消費明細 */}
          <div className="bg-white rounded-3xl border border-sky-100 p-5 shadow-xs">
            <div className="flex justify-between items-center mb-3">
              <div>
                <h2 className="text-sm font-bold text-slate-800">
                  【{currentTrip?.name}】消費明細
                </h2>
                <span className="text-[11px] text-slate-400">（左滑項目可刪除）</span>
              </div>
              <span className="text-xs text-slate-400">匯率：{currentTrip?.rate || 0.22}</span>
            </div>

            {(!currentTrip?.expenses || currentTrip.expenses.length === 0) ? (
              <div className="text-center py-12 text-xs text-slate-400">
                目前尚無紀錄，點擊上方「＋ 為此旅程記一筆」新增機票或消費！
              </div>
            ) : (
              <div className="rounded-2xl overflow-hidden border border-sky-100 divide-y divide-sky-50">
                {currentTrip.expenses.map(ex => (
                  <ExpenseItem
                    key={ex.id}
                    ex={ex}
                    toTWD={toTWD}
                    onEdit={handleOpenEdit}
                    onDelete={handleDeleteExpense}
                  />
                ))}
              </div>
            )}
          </div>

          {/* 彈窗 1：新增 / 修改消費 */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-sky-100 text-xs">
                <div className="flex justify-between items-center pb-3 border-b border-sky-100">
                  <h3 className="font-bold text-base text-slate-900">
                    {editingId ? '修改消費紀錄' : '記一筆消費'}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 text-sm">✕</button>
                </div>

                <form onSubmit={handleSave} className="mt-4 space-y-3">
                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">品項名稱</label>
                    <input
                      type="text"
                      required
                      placeholder="例：酷航機票、新宿飯店"
                      value={formData.title}
                      onChange={e => setFormData({ ...formData, title: e.target.value })}
                      className="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">階段</label>
                      <select
                        value={formData.stage}
                        onChange={e => setFormData({ ...formData, stage: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      >
                        <option value="pre">行前預付</option>
                        <option value="local">當地開銷</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">類別</label>
                      <select
                        value={formData.category}
                        onChange={e => setFormData({ ...formData, category: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      >
                        <option value="機票">機票</option>
                        <option value="住宿">住宿</option>
                        <option value="食">食</option>
                        <option value="交通">交通</option>
                        <option value="娛樂">娛樂</option>
                        <option value="衣服">衣服</option>
                        <option value="其他">其他</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">幣別</label>
                      <select
                        value={formData.currency}
                        onChange={e => setFormData({ ...formData, currency: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2"
                      >
                        <option value={currentTrip?.currency || 'JPY'}>{currentTrip?.currency || 'JPY'} 當地外幣</option>
                        <option value="TWD">TWD 台幣</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 mb-1 font-semibold">金額</label>
                      <input
                        type="number"
                        required
                        placeholder="0"
                        value={formData.origAmount}
                        onChange={e => setFormData({ ...formData, origAmount: e.target.value })}
                        className="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">日期</label>
                    <input
                      type="date"
                      required
                      value={formData.date}
                      onChange={e => setFormData({ ...formData, date: e.target.value })}
                      className="w-full bg-slate-50 border border-sky-100 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-sky-500"
                    />
                  </div>

                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">支付方式</label>
                    <select
                      value={formData.payMethodId}
                      onChange={e => {
                        if (e.target.value === '__add_new__') {
                          setIsNewPayMethodModalOpen(true);
                        } else {
                          setFormData({ ...formData, payMethodId: e.target.value });
                        }
                      }}
                      className="w-full bg-slate-50 border border-sky-100 rounded-xl px-2 py-2 text-slate-800 font-medium"
                    >
                      {payMethods.map(m => (
                        <option key={m.id} value={m.id}>{m.name}</option>
                      ))}
                      <option value="__add_new__" className="text-sky-600 font-semibold">＋ 新增支付方式...</option>
                    </select>
                  </div>

                  <div className="pt-3 flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 text-slate-400 font-medium"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-xl font-semibold shadow-sm"
                    >
                      {editingId ? '確認更新' : '儲存'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 彈窗 2：新增新旅程 */}
          {isNewTripModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-sky-100 text-xs">
                <div className="flex justify-between items-center pb-3 border-b border-sky-100">
                  <h3 className="font-bold text-base text-slate-900">規劃新旅程</h3>
                  <button onClick={() => setIsNewTripModalOpen(false)} className="text-slate-400 text-sm">✕</button>
                </div>

                <form onSubmit={handleCreateTrip} className="mt-4 space-y-3">
                  <div>
                    <label className="block text-slate-600 mb-1 font-semibold">旅程名稱</label>
                    <input
                      type="text"
                      required
                      placeholder="例：2026/12 泰國曼谷"
