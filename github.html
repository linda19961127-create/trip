<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊記帳</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 隱藏原生卷軸但保有捲動功能 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-50 via-blue-50/40 to-slate-50 min-h-screen text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 星展銀行 (DBS) 預設卡庫 ---
    const DBS_INITIAL_CARDS = [
      { id: 'dbs-eco', name: '星展 eco 永續卡 (日韓歐美加碼)', rate: 5.0, fee: 1.5, notes: '日/韓/歐美實體加碼最優 5%，扣除 1.5% 手續費淨賺 3.5%' },
      { id: 'dbs-eco-gen', name: '星展 eco 永續卡 (一般海外/網購)', rate: 1.5, fee: 1.5, notes: '國內外基礎 1.5% 現金積點無上限，剛好抵銷海外手續費' },
      { id: 'dbs-flight', name: '星展 飛行世界卡 (哩程累積)', rate: 3.3, fee: 1.5, notes: '海外每 NT$15 = 1 哩 (約 3.3% 價值)，長榮/華航/新航自由兌換' },
      { id: 'dbs-everyday', name: '星展 everyday 威士御璽卡', rate: 3.0, fee: 1.5, notes: '指定日常消費與海外享活利積分加倍折抵' },
      { id: 'dbs-custom', name: '自訂其他星展信用卡', rate: 2.0, fee: 1.5, notes: '可自由調整回饋率與手續費' }
    ];

    // --- 初始空白狀態 ---
    const CLEAN_INITIAL_TRIPS = [
      {
        id: 'trip-first',
        name: '我的第一趟旅程 (點擊切換或右上角新增)',
        startDate: new Date().toISOString().split('T')[0],
        endDate: new Date(Date.now() + 6 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
        currency: 'JPY',
        currencySymbol: '¥',
        targetBudgetTWD: 50000,
        companions: ['我', '旅伴A'],
        exchanges: [],
        expenses: []
      }
    ];

    const CATEGORY_ICONS = {
      機票: '✈️', 住宿: '🏨', 食: '🍱', 喝: '☕',
      娛樂: '🎟️', 衣服: '🛍️', 交通: '🚌', 其他: '📦'
    };

    function App() {
      const [trips, setTrips] = useState(() => {
        const saved = localStorage.getItem('DBS_TRAVEL_APP_TRIPS');
        return saved ? JSON.parse(saved) : CLEAN_INITIAL_TRIPS;
      });

      const [cards, setCards] = useState(() => {
        const saved = localStorage.getItem('DBS_TRAVEL_APP_CARDS');
        return saved ? JSON.parse(saved) : DBS_INITIAL_CARDS;
      });

      const [activeTripId, setActiveTripId] = useState(() => trips[0]?.id || '');
      const [activeTab, setActiveTab] = useState('expenses');
      const [copiedSuccess, setCopiedSuccess] = useState(false);

      useEffect(() => {
        localStorage.setItem('DBS_TRAVEL_APP_TRIPS', JSON.stringify(trips));
      }, [trips]);

      useEffect(() => {
        localStorage.setItem('DBS_TRAVEL_APP_CARDS', JSON.stringify(cards));
      }, [cards]);

      const currentTrip = useMemo(() => {
        return trips.find(t => t.id === activeTripId) || trips[0] || null;
      }, [trips, activeTripId]);

      // 加權匯率計算
      const exchangeStats = useMemo(() => {
        if (!currentTrip || !currentTrip.exchanges || currentTrip.exchanges.length === 0) {
          return { totalTwd: 0, totalForeign: 0, avgRate: 0.22 };
        }
        const totalTwd = currentTrip.exchanges.reduce((sum, item) => sum + Number(item.twdAmount || 0), 0);
        const totalForeign = currentTrip.exchanges.reduce((sum, item) => sum + Number(item.foreignAmount || 0), 0);
        const avgRate = totalForeign > 0 ? totalTwd / totalForeign : 0.22;
        return { totalTwd, totalForeign, avgRate };
      }, [currentTrip]);

      const convertToTWD = (item) => {
        if (!item) return 0;
        if (item.currency === 'TWD') return Number(item.origAmount || 0);
        const rate = exchangeStats.avgRate || 0.22;
        return Math.round(Number(item.origAmount || 0) * rate);
      };

      // 星展卡回饋計算
      const calculateCardRewards = (item) => {
        if (item.payMethod !== 'card' || !item.cardId) {
          return { feeTWD: 0, rewardTWD: 0, netRewardTWD: 0, cardName: '' };
        }
        const card = cards.find(c => c.id === item.cardId);
        if (!card) return { feeTWD: 0, rewardTWD: 0, netRewardTWD: 0, cardName: '星展卡' };

        const twdVal = convertToTWD(item);
        const feeTWD = Math.round(twdVal * (Number(card.fee || 1.5) / 100));
        const rewardTWD = Math.round(twdVal * (Number(card.rate || 0) / 100));
        return {
          feeTWD,
          rewardTWD,
          netRewardTWD: rewardTWD - feeTWD,
          cardName: card.name
        };
      };

      // 分帳計算
      const memberBalances = useMemo(() => {
        if (!currentTrip || !currentTrip.companions) return { balances: {}, myTotalShare: 0 };
        const balanceMap = {};
        currentTrip.companions.forEach(c => balanceMap[c] = { paid: 0, owed: 0, net: 0 });

        currentTrip.expenses.forEach(item => {
          const twd = convertToTWD(item);
          const payer = item.payer || '我';
          if (!balanceMap[payer]) balanceMap[payer] = { paid: 0, owed: 0, net: 0 };
          balanceMap[payer].paid += twd;

          if (item.splitType === 'self') {
            balanceMap[payer].owed += twd;
          } else if (item.splitType === 'selected_even') {
            const participants = (item.involvedCompanions && item.involvedCompanions.length > 0)
              ? item.involvedCompanions : [payer];
            const perPerson = Math.floor(twd / participants.length);
            const remainder = twd - (perPerson * participants.length);

            participants.forEach((p, idx) => {
              if (!balanceMap[p]) balanceMap[p] = { paid: 0, owed: 0, net: 0 };
              balanceMap[p].owed += perPerson + (idx === 0 ? remainder : 0);
            });
          } else if (item.splitType === 'custom_amount') {
            Object.entries(item.customAmounts || {}).forEach(([person, amt]) => {
              if (!balanceMap[person]) balanceMap[person] = { paid: 0, owed: 0, net: 0 };
              const personTwd = item.currency === 'TWD' ? Number(amt) : Math.round(Number(amt) * exchangeStats.avgRate);
              balanceMap[person].owed += personTwd;
            });
          } else if (item.splitType === 'single_reimburse') {
            const target = item.targetCompanion || payer;
            if (!balanceMap[target]) balanceMap[target] = { paid: 0, owed: 0, net: 0 };
            balanceMap[target].owed += twd;
          }
        });

        Object.keys(balanceMap).forEach(p => {
          balanceMap[p].net = balanceMap[p].paid - balanceMap[p].owed;
        });

        return {
          balances: balanceMap,
          myTotalShare: balanceMap['我'] ? balanceMap['我'].owed : 0
        };
      }, [currentTrip, exchangeStats]);

      // 找補轉帳路徑
      const settlementTransfers = useMemo(() => {
        if (!memberBalances || !memberBalances.balances) return [];
        let creditors = [];
        let debtors = [];

        Object.entries(memberBalances.balances).forEach(([name, data]) => {
          if (data.net > 1) creditors.push({ name, amount: data.net });
          else if (data.net < -1) debtors.push({ name, amount: Math.abs(data.net) });
        });

        creditors.sort((a, b) => b.amount - a.amount);
        debtors.sort((a, b) => b.amount - a.amount);

        const transfers = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
          const settle = Math.min(debtors[i].amount, creditors[j].amount);
          if (settle > 0) {
            transfers.push({ from: debtors[i].name, to: creditors[j].name, amount: Math.round(settle) });
          }
          debtors[i].amount -= settle;
          creditors[j].amount -= settle;
          if (debtors[i].amount <= 1) i++;
          if (creditors[j].amount <= 1) j++;
        }
        return transfers;
      }, [memberBalances]);

      // LINE 清單複製
      const copyToLine = () => {
        if (!currentTrip) return;
        let text = `✈️【${currentTrip.name}】旅費分帳結算 ✈️\n📅 時間：${currentTrip.startDate} ~ ${currentTrip.endDate}\n--------------------------------\n💰【找補轉帳名單】：\n`;
        if (settlementTransfers.length === 0) {
          text += `全員帳目平衡，無須互相轉帳！🎉\n`;
        } else {
          settlementTransfers.forEach((tr, idx) => {
            text += `${idx + 1}. ${tr.from} ➡️ 轉給【${tr.to}】 NT$ ${tr.amount.toLocaleString()} 元\n`;
          });
        }
        text += `--------------------------------\n各成員負擔：\n`;
        Object.entries(memberBalances.balances).forEach(([p, d]) => {
          text += `• ${p}：應負擔 NT$ ${d.owed.toLocaleString()} (先墊 NT$ ${d.paid.toLocaleString()})\n`;
        });
        
        const temp = document.createElement('textarea');
        temp.value = text;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);

        setCopiedSuccess(true);
        setTimeout(() => setCopiedSuccess(false), 2000);
      };

      // 總花費統計
      const tripTotals = useMemo(() => {
        if (!currentTrip) return {};
        let total = 0, pre = 0, local = 0, card = 0, cash = 0, foreignCashUsed = 0, netRewards = 0;
        const catMap = { 機票: 0, 住宿: 0, 食: 0, 喝: 0, 娛樂: 0, 衣服: 0, 交通: 0, 其他: 0 };

        currentTrip.expenses.forEach(e => {
          const twd = convertToTWD(e);
          total += twd;
          if (e.stage === 'pre') pre += twd; else local += twd;
          if (e.payMethod === 'card') {
            card += twd;
            netRewards += calculateCardRewards(e).netRewardTWD;
          } else {
            cash += twd;
            if (e.currency !== 'TWD') foreignCashUsed += Number(e.origAmount || 0);
          }
          if (catMap[e.category] !== undefined) catMap[e.category] += twd;
          else catMap['其他'] += twd;
        });

        return {
          total, pre, local, card, cash,
          remainingCash: exchangeStats.totalForeign - foreignCashUsed,
          netRewards,
          catMap
        };
      }, [currentTrip, exchangeStats, cards]);

      // 記帳 Modal
      const [isExpModal, setIsExpModal] = useState(false);
      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        stage: 'local',
        category: '食',
        title: '',
        payMethod: 'card',
        cardId: 'dbs-eco',
        currency: 'JPY',
        origAmount: '',
        payer: '我',
        splitType: 'selected_even',
        involvedCompanions: ['我'],
        notes: ''
      });

      const openExpenseModal = () => {
        setFormData({
          date: new Date().toISOString().split('T')[0],
          stage: 'local',
          category: '食',
          title: '',
          payMethod: 'card',
          cardId: cards[0]?.id || 'dbs-eco',
          currency: currentTrip?.currency || 'JPY',
          origAmount: '',
          payer: '我',
          splitType: 'selected_even',
          involvedCompanions: [...(currentTrip?.companions || ['我'])],
          notes: ''
        });
        setIsExpModal(true);
      };

      const saveExpense = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.origAmount) return;
        const entry = {
          ...formData,
          id: `exp-${Date.now()}`,
          origAmount: parseFloat(formData.origAmount)
        };
        setTrips(prev => prev.map(t => t.id === activeTripId ? { ...t, expenses: [entry, ...t.expenses] } : t));
        setIsExpModal(false);
      };

      // 新增旅程 Modal
      const [isTripModal, setIsTripModal] = useState(false);
      const [newTrip, setNewTrip] = useState({
        name: '', startDate: '', endDate: '', currency: 'JPY', currencySymbol: '¥', companions: '我, 旅伴A'
      });

      const saveTrip = (e) => {
        e.preventDefault();
        if (!newTrip.name) return;
        const companions = newTrip.companions.split(',').map(s => s.trim()).filter(Boolean);
        const tripObj = {
          id: `trip-${Date.now()}`,
          name: newTrip.name,
          startDate: newTrip.startDate,
          endDate: newTrip.endDate,
          currency: newTrip.currency.toUpperCase(),
          currencySymbol: newTrip.currencySymbol || '$',
          targetBudgetTWD: 60000,
          companions: companions.length ? companions : ['我'],
          exchanges: [],
          expenses: []
        };
        setTrips(prev => [...prev, tripObj]);
        setActiveTripId(tripObj.id);
        setIsTripModal(false);
      };

      // 換匯 Modal
      const [isExModal, setIsExModal] = useState(false);
      const [exchangeForm, setExchangeForm] = useState({ twd: '', foreign: '', date: new Date().toISOString().split('T')[0] });

      const saveExchange = (e) => {
        e.preventDefault();
        if (!exchangeForm.twd || !exchangeForm.foreign) return;
        const ex = {
          id: `ex-${Date.now()}`,
          date: exchangeForm.date,
          twdAmount: Number(exchangeForm.twd),
          foreignAmount: Number(exchangeForm.foreign),
          channel: '星展 Card+ 線上結匯'
        };
        setTrips(prev => prev.map(t => t.id === activeTripId ? { ...t, exchanges: [ex, ...(t.exchanges || [])] } : t));
        setIsExModal(false);
      };

      return (
        <div className="max-w-6xl mx-auto px-4 py-6">
          {/* 頂部 Header */}
          <header className="bg-white/80 backdrop-blur-md rounded-2xl p-4 shadow-sm border border-sky-100 flex items-center justify-between mb-6">
            <div className="flex items-center space-x-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center text-white text-lg font-bold shadow-md shadow-sky-200">
                ✈️
              </div>
              <div>
                <h1 className="text-xl font-bold text-slate-900 tracking-tight">旅遊記帳</h1>
                <p className="text-xs text-slate-500">出國花費 • 星展回饋試算 • 旅伴 AA 分帳</p>
              </div>
            </div>
            <button
              onClick={() => setIsTripModal(true)}
              className="px-4 py-2 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white rounded-xl text-xs font-semibold shadow-sm transition"
            >
              ＋ 新旅程
            </button>
          </header>

          {/* 旅程切換與基本資訊 */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
            <div className="flex items-center space-x-2 overflow-x-auto pb-1 no-scrollbar">
              <span className="text-xs font-semibold text-slate-400 whitespace-nowrap">旅程：</span>
              {trips.map(t => (
                <button
                  key={t.id}
                  onClick={() => setActiveTripId(t.id)}
                  className={`px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition border ${
                    t.id === activeTripId
                      ? 'bg-gradient-to-r from-sky-500 to-blue-600 text-white border-transparent shadow-sm'
                      : 'bg-white text-slate-700 border-sky-100 hover:bg-sky-50'
                  }`}
                >
                  {t.name} ({t.currency})
                </button>
              ))}
            </div>

            {currentTrip && (
              <div className="text-xs text-slate-600 bg-white px-3 py-1.5 rounded-xl border border-sky-100 shadow-2xs">
                📅 {currentTrip.startDate} ~ {currentTrip.endDate} ｜ 👥 旅伴：{currentTrip.companions?.join(', ')}
              </div>
            )}
          </div>

          {/* 統計指標卡 */}
          {currentTrip && (
            <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 mb-6">
              <div className="bg-white p-3.5 rounded-2xl border border-sky-100 shadow-2xs">
                <span className="text-xs text-slate-500">總支出 (TWD)</span>
                <div className="text-xl font-bold text-slate-900 mt-1">${tripTotals.total?.toLocaleString()}</div>
                <div className="text-[10px] text-slate-400 mt-0.5">帳面合計</div>
              </div>
              <div className="bg-gradient-to-b from-sky-50 to-white p-3.5 rounded-2xl border border-sky-200 shadow-2xs">
                <span className="text-xs text-sky-800 font-semibold">個人實質負擔</span>
                <div className="text-xl font-bold text-sky-900 mt-1">${memberBalances.myTotalShare?.toLocaleString()}</div>
                <div className="text-[10px] text-sky-600 mt-0.5">分帳對沖後</div>
              </div>
              <div className="bg-white p-3.5 rounded-2xl border border-sky-100 shadow-2xs">
                <span className="text-xs text-blue-600">行前預購 (機酒)</span>
                <div className="text-xl font-bold text-slate-900 mt-1">${tripTotals.pre?.toLocaleString()}</div>
                <div className="text-[10px] text-slate-400 mt-0.5">現場: ${tripTotals.local?.toLocaleString()}</div>
              </div>
              <div className="bg-gradient-to-b from-emerald-50 to-white p-3.5 rounded-2xl border border-emerald-200 shadow-2xs">
                <span className="text-xs text-emerald-800 font-semibold">星展淨回饋</span>
                <div className="text-xl font-bold text-emerald-700 mt-1">+${tripTotals.netRewards?.toLocaleString()}</div>
                <div className="text-[10px] text-emerald-600 mt-0.5">已扣1.5%手續費</div>
              </div>
              <div className="bg-white p-3.5 rounded-2xl border border-sky-100 shadow-2xs cursor-pointer" onClick={() => setIsExModal(true)}>
                <span className="text-xs text-amber-700 font-semibold">加權平均匯率</span>
                <div className="text-xl font-bold text-amber-800 mt-1">{exchangeStats.avgRate.toFixed(4)}</div>
                <div className="text-[10px] text-slate-400 mt-0.5">換匯 ${exchangeStats.totalTwd.toLocaleString()}</div>
              </div>
              <div className="bg-white p-3.5 rounded-2xl border border-sky-100 shadow-2xs">
                <span className="text-xs text-indigo-700 font-semibold">現鈔庫存剩餘</span>
                <div className="text-xl font-bold text-indigo-900 mt-1">{currentTrip.currencySymbol}{tripTotals.remainingCash?.toLocaleString()}</div>
                <div className="text-[10px] text-slate-400 mt-0.5">{currentTrip.currency} 現金</div>
              </div>
            </div>
          )}

          {/* 頁籤 */}
          <div className="flex border-b border-sky-100 gap-2 mb-6">
            {[
              { id: 'expenses', label: '記帳清單' },
              { id: 'split', label: `旅伴分帳 (${settlementTransfers.length}筆轉帳)` },
              { id: 'analytics', label: '統計分析' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`py-2 px-4 text-xs font-semibold border-b-2 transition -mb-[1px] ${
                  activeTab === tab.id
                    ? 'border-sky-600 text-sky-700 bg-white rounded-t-xl shadow-2xs'
                    : 'border-transparent text-slate-500 hover:text-sky-600'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* TAB 1: 記帳清單 */}
          {activeTab === 'expenses' && (
            <div className="space-y-4">
              <div className="flex justify-end">
                <button
                  onClick={openExpenseModal}
                  className="px-4 py-2 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white rounded-xl text-xs font-semibold shadow-sm transition"
                >
                  ＋ 記一筆 (支援提前預購機酒與分帳)
                </button>
              </div>

              <div className="bg-white rounded-2xl border border-sky-100 divide-y divide-sky-50 shadow-2xs overflow-hidden">
                {currentTrip?.expenses.length === 0 ? (
                  <div className="p-10 text-center text-xs text-slate-400">
                    尚未有任何支出，點選上方「＋ 記一筆」新增機票、住宿或當地花費！
                  </div>
                ) : (
                  currentTrip?.expenses.map(item => {
                    const twd = convertToTWD(item);
                    const rewards = calculateCardRewards(item);
                    return (
                      <div key={item.id} className="p-3.5 hover:bg-sky-50/40 transition flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                          <span className="text-xl p-2 bg-sky-50 rounded-xl">{CATEGORY_ICONS[item.category] || '📦'}</span>
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="font-semibold text-slate-800 text-sm">{item.title}</span>
                              {item.stage === 'pre' && (
                                <span className="text-[10px] bg-blue-50 text-blue-600 border border-blue-200 px-1.5 py-0.5 rounded-full">
                                  行前預付
                                </span>
                              )}
                              <span className="text-[11px] text-slate-400">{item.date}</span>
                            </div>
                            <div className="text-xs text-slate-500 flex flex-wrap gap-2 mt-1">
                              <span>由 <strong>{item.payer}</strong> 付款</span>
                              <span>•</span>
                              <span>{item.payMethod === 'card' ? `💳 刷卡 (${rewards.cardName})` : '💵 現金支付'}</span>
                              {rewards.netRewardTWD > 0 && (
                                <span className="text-emerald-600 font-semibold">(淨賺 +${rewards.netRewardTWD})</span>
                              )}
                              <span>•</span>
                              <span className="text-sky-700 bg-sky-50 px-1.5 py-0.2 rounded border border-sky-100 text-[11px]">
                                {item.splitType === 'self' && '個人全額'}
                                {item.splitType === 'selected_even' && `均分: ${item.involvedCompanions?.join(', ')}`}
                              </span>
                            </div>
                          </div>
                        </div>
                        <div className="text-right">
                          <div className="font-bold text-slate-900">${twd.toLocaleString()} <span className="text-xs font-normal text-slate-400">TWD</span></div>
                          {item.currency !== 'TWD' && (
                            <div className="text-xs text-slate-400">{item.currency} {Number(item.origAmount).toLocaleString()}</div>
                          )}
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          )}

          {/* TAB 2: 旅伴分帳 */}
          {activeTab === 'split' && (
            <div className="space-y-6">
              <div className="bg-gradient-to-r from-sky-50 to-indigo-50 border border-sky-200 p-4 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <h3 className="text-sm font-bold text-slate-900">找補轉帳與 LINE 一鍵複製</h3>
                  <p className="text-xs text-slate-500 mt-0.5">系統自動將每位成員的墊款與享受消費對沖，省去算數學的時間！</p>
                </div>
                <button
                  onClick={copyToLine}
                  className="px-4 py-2 bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-xl text-xs font-bold shadow-sm whitespace-nowrap"
                >
                  {copiedSuccess ? '✅ 已複製！' : '📋 複製 LINE 結算清單'}
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {settlementTransfers.length === 0 ? (
                  <div className="col-span-full bg-white p-6 rounded-2xl border border-sky-100 text-center text-xs text-slate-500">
                    🎉 太棒了！全體帳目已平，不需要額外轉帳！
                  </div>
                ) : (
                  settlementTransfers.map((item, idx) => (
                    <div key={idx} className="bg-white p-4 rounded-2xl border border-sky-100 shadow-2xs flex items-center justify-between">
                      <div className="flex items-center space-x-2">
                        <span className="font-semibold text-rose-600 text-sm">{item.from}</span>
                        <span className="text-slate-400 text-xs">轉給</span>
                        <span className="font-semibold text-emerald-600 text-sm">{item.to}</span>
                      </div>
                      <div className="text-base font-bold text-slate-900">
                        ${item.amount.toLocaleString()} <span className="text-xs font-normal text-slate-400">TWD</span>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {/* TAB 3: 統計分析 */}
          {activeTab === 'analytics' && (
            <div className="bg-white p-5 rounded-2xl border border-sky-100 shadow-2xs space-y-4">
              <h3 className="text-sm font-bold text-slate-800">各類別花費結構</h3>
              <div className="space-y-3 text-xs">
                {Object.entries(tripTotals.catMap || {}).map(([cat, val]) => {
                  const pct = tripTotals.total > 0 ? Math.round((val / tripTotals.total) * 100) : 0;
                  return (
                    <div key={cat} className="space-y-1">
                      <div className="flex justify-between text-slate-600">
                        <span>{CATEGORY_ICONS[cat]} {cat}</span>
                        <span>${val.toLocaleString()} TWD ({pct}%)</span>
                      </div>
                      <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div className="h-full bg-gradient-to-r from-sky-400 to-blue-600 rounded-full" style={{ width: `${pct}%` }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* 記帳彈窗 Modal */}
          {isExpModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full border border-sky-100 shadow-2xl max-h-[90vh] overflow-y-auto text-xs space-y-3">
                <div className="flex justify-between items-center pb-2 border-b border-sky-100">
                  <h3 className="text-sm font-bold text-slate-900">新增記帳</h3>
                  <button onClick={() => setIsExpModal(false)} className="text-slate-400">✕</button>
                </div>
                <form onSubmit={saveExpense} className="space-y-3">
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">付款日期</label>
                      <input type="date" required value={formData.date} onChange={e => setFormData({ ...formData, date: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2" />
                    </div>
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">階段</label>
                      <select value={formData.stage} onChange={e => setFormData({ ...formData, stage: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2">
                        <option value="pre">行前預付 (機票/住宿)</option>
                        <option value="local">當地即時開銷</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">類別</label>
                      <select value={formData.category} onChange={e => setFormData({ ...formData, category: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2">
                        {Object.keys(CATEGORY_ICONS).map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div className="col-span-2">
                      <label className="text-slate-600 font-semibold block mb-1">品項名稱</label>
                      <input type="text" required placeholder="如：酷航來回機票、一蘭拉麵" value={formData.title} onChange={e => setFormData({ ...formData, title: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2" />
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">幣別</label>
                      <select value={formData.currency} onChange={e => setFormData({ ...formData, currency: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2">
                        <option value="TWD">TWD 台幣</option>
                        <option value={currentTrip?.currency || 'JPY'}>{currentTrip?.currency || 'JPY'}</option>
                      </select>
                    </div>
                    <div className="col-span-2">
                      <label className="text-slate-600 font-semibold block mb-1">原幣金額</label>
                      <input type="number" step="any" required placeholder="金額" value={formData.origAmount} onChange={e => setFormData({ ...formData, origAmount: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2" />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-600 font-semibold block mb-1">支付方式</label>
                    <select value={formData.payMethod} onChange={e => setFormData({ ...formData, payMethod: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2">
                      <option value="card">💳 刷星展信用卡 (自動扣 1.5% 算回饋)</option>
                      <option value="cash">💵 外幣現金現鈔</option>
                    </select>
                  </div>

                  {formData.payMethod === 'card' && (
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">星展卡別</label>
                      <select value={formData.cardId} onChange={e => setFormData({ ...formData, cardId: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2">
                        {cards.map(c => <option key={c.id} value={c.id}>{c.name} ({c.rate}%)</option>)}
                      </select>
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-2 pt-2 border-t border-sky-100">
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">誰先付的？</label>
                      <select value={formData.payer} onChange={e => setFormData({ ...formData, payer: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2">
                        {currentTrip?.companions.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">分攤方式</label>
                      <select value={formData.splitType} onChange={e => setFormData({ ...formData, splitType: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2">
                        <option value="selected_even">成員多選平分 (有吃才分)</option>
                        <option value="self">個人全自費</option>
                      </select>
                    </div>
                  </div>

                  {formData.splitType === 'selected_even' && (
                    <div className="p-2.5 bg-sky-50 rounded-xl">
                      <span className="text-slate-700 font-semibold block mb-1">請勾選參與的旅伴：</span>
                      <div className="grid grid-cols-2 gap-1.5">
                        {currentTrip?.companions.map(companion => (
                          <label key={companion} className="flex items-center space-x-2">
                            <input
                              type="checkbox"
                              checked={formData.involvedCompanions?.includes(companion)}
                              onChange={() => {
                                const list = formData.involvedCompanions || [];
                                const updated = list.includes(companion) ? list.filter(c => c !== companion) : [...list, companion];
                                setFormData({ ...formData, involvedCompanions: updated });
                              }}
                            />
                            <span>{companion}</span>
                          </label>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="pt-2 flex justify-end space-x-2">
                    <button type="button" onClick={() => setIsExpModal(false)} className="px-3 py-1.5 text-slate-500">取消</button>
                    <button type="submit" className="px-4 py-1.5 bg-sky-600 text-white rounded-xl font-semibold">儲存</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 新旅程 Modal */}
          {isTripModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full border border-sky-100 shadow-2xl text-xs space-y-3">
                <h3 className="text-sm font-bold text-slate-900 pb-2 border-b border-sky-100">建立新旅程</h3>
                <form onSubmit={saveTrip} className="space-y-3">
                  <div>
                    <label className="text-slate-600 font-semibold block mb-1">旅程名稱</label>
                    <input type="text" required placeholder="如：2026/11 日本東京" value={newTrip.name} onChange={e => setNewTrip({ ...newTrip, name: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">出發日</label>
                      <input type="date" required value={newTrip.startDate} onChange={e => setNewTrip({ ...newTrip, startDate: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2" />
                    </div>
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">返程日</label>
                      <input type="date" required value={newTrip.endDate} onChange={e => setNewTrip({ ...newTrip, endDate: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">外幣代號</label>
                      <input type="text" placeholder="JPY, THB..." value={newTrip.currency} onChange={e => setNewTrip({ ...newTrip, currency: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2" />
                    </div>
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">符號</label>
                      <input type="text" placeholder="¥, ฿..." value={newTrip.currencySymbol} onChange={e => setNewTrip({ ...newTrip, currencySymbol: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2" />
                    </div>
                  </div>
                  <div>
                    <label className="text-slate-600 font-semibold block mb-1">旅伴名單 (逗號隔開)</label>
                    <input type="text" placeholder="我, 佳諭, 小明" value={newTrip.companions} onChange={e => setNewTrip({ ...newTrip, companions: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2" />
                  </div>
                  <div className="pt-2 flex justify-end space-x-2">
                    <button type="button" onClick={() => setIsTripModal(false)} className="px-3 py-1.5 text-slate-500">取消</button>
                    <button type="submit" className="px-4 py-1.5 bg-sky-600 text-white rounded-xl font-semibold">建立</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 換匯 Modal */}
          {isExModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full border border-sky-100 shadow-2xl text-xs space-y-3">
                <h3 className="text-sm font-bold text-slate-900 pb-2 border-b border-sky-100">記錄一筆換匯</h3>
                <form onSubmit={saveExchange} className="space-y-3">
                  <div>
                    <label className="text-slate-600 font-semibold block mb-1">換匯日期</label>
                    <input type="date" required value={exchangeForm.date} onChange={e => setExchangeForm({ ...exchangeForm, date: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2" />
                  </div>
                  <div>
                    <label className="text-slate-600 font-semibold block mb-1">支付台幣 (TWD)</label>
                    <input type="number" required placeholder="如 20000" value={exchangeForm.twd} onChange={e => setExchangeForm({ ...exchangeForm, twd: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2" />
                  </div>
                  <div>
                    <label className="text-slate-600 font-semibold block mb-1">換得外幣 ({currentTrip?.currency})</label>
                    <input type="number" required placeholder="如 92000" value={exchangeForm.foreign} onChange={e => setExchangeForm({ ...exchangeForm, foreign: e.target.value })} className="w-full bg-slate-50 border border-sky-100 rounded-xl p-2" />
                  </div>
                  {exchangeForm.twd && exchangeForm.foreign && Number(exchangeForm.foreign) > 0 && (
                    <div className="p-2 bg-amber-50 rounded-xl text-amber-800">
                      實質匯率：<strong>{(Number(exchangeForm.twd) / Number(exchangeForm.foreign)).toFixed(4)}</strong>
                    </div>
                  )}
                  <div className="pt-2 flex justify-end space-x-2">
                    <button type="button" onClick={() => setIsExModal(false)} className="px-3 py-1.5 text-slate-500">取消</button>
                    <button type="submit" className="px-4 py-1.5 bg-amber-500 text-white rounded-xl font-semibold">新增</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
